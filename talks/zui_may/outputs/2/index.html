<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feeling of Computing multimedia ZUI</title>
<style>
:root {
  color-scheme: dark;
  --bg: #020303;
  --panel: rgba(10, 12, 12, 0.88);
  --panel-strong: rgba(16, 19, 18, 0.96);
  --line: rgba(255, 255, 255, 0.15);
  --line-strong: rgba(255, 255, 255, 0.26);
  --text: rgba(255, 255, 255, 0.92);
  --muted: rgba(255, 255, 255, 0.62);
  --accent: #72e0d1;
  --accent-2: #ffc857;
  --accent-3: #ff7a90;
}
* { box-sizing: border-box; }
html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button,
input {
  font: inherit;
}
button:focus-visible,
[role="button"]:focus-visible,
[role="separator"]:focus-visible {
  outline: 2px solid rgba(114, 224, 209, 0.84);
  outline-offset: 2px;
}
.app {
  display: grid;
  grid-template-columns: minmax(280px, var(--map-width, 1.08fr)) 8px minmax(390px, 0.72fr);
  grid-template-areas: "map split media";
  height: 100vh;
  overflow: hidden;
  background: #000;
}
.app.has-custom-columns {
  grid-template-columns: minmax(280px, var(--map-width)) 8px minmax(390px, 1fr);
}
.map-stage {
  grid-area: map;
  position: relative;
  min-width: 0;
  min-height: 0;
  background: #000;
}
#viewport {
  position: absolute;
  inset: 0;
  overflow: hidden;
  cursor: grab;
  touch-action: none;
  user-select: none;
}
#viewport.dragging { cursor: grabbing; }
#map {
  position: absolute;
  left: 0;
  top: 0;
  width: 770px;
  height: 770px;
  transform-origin: 0 0;
  will-change: transform;
}
#map svg {
  width: 770px;
  height: 770px;
  overflow: visible;
}
#topic-svg .topic.is-hovered .node-hit {
  fill: rgba(255, 122, 144, 0.16);
  stroke: rgba(255, 122, 144, 0.92);
  stroke-width: 3px;
}
#topic-svg .topic.is-active .node-hit {
  fill: rgba(114, 224, 209, 0.18);
  stroke: rgba(114, 224, 209, 0.96);
  stroke-width: 3.2px;
}
#topic-svg .topic.is-selected .node-hit {
  fill: rgba(255, 200, 87, 0.18);
  stroke: rgba(255, 200, 87, 0.98);
  stroke-width: 3.8px;
}
.vertical-splitter,
.horizontal-splitter,
.lower-splitter {
  position: relative;
  min-width: 0;
  min-height: 0;
  background: #050606;
  touch-action: none;
  user-select: none;
  z-index: 3;
}
.vertical-splitter {
  grid-area: split;
}
.vertical-splitter,
.lower-splitter {
  cursor: col-resize;
  border-left: 1px solid rgba(255, 255, 255, 0.08);
  border-right: 1px solid rgba(255, 255, 255, 0.08);
}
.horizontal-splitter {
  cursor: row-resize;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.vertical-splitter::after,
.horizontal-splitter::after,
.lower-splitter::after {
  content: "";
  position: absolute;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 999px;
  transition: background 140ms ease-out;
}
.vertical-splitter::after {
  top: 50%;
  left: 50%;
  width: 2px;
  height: 38px;
  transform: translate(-50%, -50%);
}
.lower-splitter::after {
  top: 50%;
  left: 50%;
  width: 2px;
  height: 38px;
  transform: translate(-50%, -50%);
}
.horizontal-splitter::after {
  top: 50%;
  left: 50%;
  width: 42px;
  height: 2px;
  transform: translate(-50%, -50%);
}
.vertical-splitter:hover::after,
.horizontal-splitter:hover::after,
.lower-splitter:hover::after,
.vertical-splitter.is-dragging::after,
.horizontal-splitter.is-dragging::after,
.lower-splitter.is-dragging::after {
  background: rgba(114, 224, 209, 0.82);
}
.media-panel {
  grid-area: media;
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: auto auto 8px minmax(0, 1fr);
  background: #090b0b;
}
.media-panel.has-custom-rows {
  grid-template-rows: var(--video-height) auto 8px minmax(170px, 1fr);
}
.media-panel.has-custom-rows .video-wrap {
  height: 100%;
  aspect-ratio: auto;
}
.video-wrap {
  position: relative;
  min-height: 0;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #000;
}
video {
  display: block;
  width: 100%;
  height: 100%;
  max-height: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  object-fit: contain;
}
.caption-overlay {
  position: absolute;
  left: 50%;
  bottom: 48px;
  max-width: min(92%, 720px);
  transform: translateX(-50%);
  padding: 6px 10px;
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.72);
  color: #fff;
  font-size: 15px;
  line-height: 1.35;
  text-align: center;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.82);
  opacity: 0;
  pointer-events: none;
  transition: opacity 110ms ease-out;
}
.caption-overlay.is-visible {
  opacity: 1;
}
.chapter-strip {
  position: relative;
  min-width: 0;
  padding: 8px 8px 8px 49px;
  border-top: 1px solid rgba(255, 255, 255, 0.09);
  background: #070808;
  overflow: visible;
}
.nav-undo {
  position: absolute;
  left: 8px;
  top: 8px;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  padding: 0;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.055);
  color: rgba(255, 255, 255, 0.86);
  font-size: 11px;
  font-weight: 720;
  cursor: pointer;
}
.nav-undo:disabled {
  cursor: default;
  opacity: 0.34;
}
.lower {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(170px, var(--topics-width, 0.52fr)) 8px minmax(220px, 1fr);
  border-top: 1px solid var(--line);
}
.lower.has-custom-columns {
  grid-template-columns: minmax(120px, var(--topics-width)) 8px minmax(180px, 1fr);
}
.navigation-panel,
.transcript {
  min-width: 0;
  min-height: 0;
  overflow: auto;
}
.navigation-panel {
  padding: 9px;
  background: #070808;
  overflow: hidden;
}
.topics-panel {
  min-height: 0;
  height: 100%;
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr);
  gap: 7px;
}
.transcript {
  padding: 15px 16px 24px;
  background: #0b0d0c;
}
.section-title {
  margin: 0 0 8px;
  font-size: 12px;
  line-height: 1.2;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.chapter-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(74px, 1fr));
  gap: 5px;
}
.chapter-card {
  position: relative;
  display: grid;
  grid-template-rows: 30px minmax(0, 1fr);
  justify-items: center;
  align-items: start;
  gap: 3px;
  width: 100%;
  min-width: 0;
  height: 67px;
  padding: 4px 4px 5px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.045);
  color: var(--text);
  text-align: center;
  cursor: pointer;
}
.chapter-card:hover,
.topic-chip:hover {
  border-color: rgba(114, 224, 209, 0.66);
}
.chapter-card.is-active {
  border-color: rgba(114, 224, 209, 0.78);
  background: rgba(114, 224, 209, 0.13);
  box-shadow: inset 0 0 0 1px rgba(114, 224, 209, 0.22);
}
.chapter-icon {
  display: inline-grid;
  place-items: center;
  width: 29px;
  height: 29px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.06);
  overflow: hidden;
}
.chapter-icon img,
.topic-chip img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.chapter-number {
  position: absolute;
  top: 3px;
  left: 4px;
  color: rgba(255, 255, 255, 0.58);
  font-size: 9px;
  font-weight: 720;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.chapter-card.is-active .chapter-number {
  color: rgba(255, 255, 255, 0.94);
}
.chapter-label {
  display: -webkit-box;
  width: 100%;
  min-width: 0;
  overflow: hidden;
  color: rgba(255, 255, 255, 0.78);
  font-size: 10px;
  font-weight: 650;
  line-height: 1.08;
  text-align: center;
  overflow-wrap: anywhere;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}
.chapter-card.is-active .chapter-label {
  color: rgba(255, 255, 255, 0.98);
}
.topics-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-width: 0;
}
.topics-header .section-title {
  margin-bottom: 0;
}
.topic-threshold-value {
  color: rgba(255, 255, 255, 0.72);
  font-size: 10px;
  font-weight: 720;
  line-height: 1;
  white-space: nowrap;
}
.topic-threshold {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 3px;
}
.topic-threshold-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  color: rgba(255, 255, 255, 0.58);
  font-size: 10px;
  font-weight: 690;
  line-height: 1.05;
}
.topic-threshold input[type="range"] {
  width: 100%;
  min-width: 0;
  accent-color: var(--accent);
}
.topic-list {
  --topic-row-height: 42px;
  --topic-icon-size: 19px;
  --topic-font-size: 9px;
  --topic-columns: 7;
  --topic-gap: 4px;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(var(--topic-columns), minmax(0, 1fr));
  grid-auto-rows: var(--topic-row-height);
  gap: var(--topic-gap);
  align-content: stretch;
  justify-content: stretch;
  overflow: hidden;
}
.topic-chip {
  --topic-opacity: 0.54;
  position: relative;
  display: grid;
  grid-template-rows: var(--topic-icon-size) minmax(0, 1fr);
  align-items: center;
  justify-items: center;
  gap: clamp(0px, calc(var(--topic-row-height) * 0.05), 3px);
  min-width: 0;
  width: 100%;
  height: 100%;
  min-height: 0;
  padding: clamp(0px, calc(var(--topic-row-height) * 0.07), 5px) clamp(1px, calc(var(--topic-row-height) * 0.05), 5px);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.055);
  color: var(--text);
  cursor: pointer;
  opacity: var(--topic-opacity);
  transition: opacity 140ms ease-out, border-color 140ms ease-out, background 140ms ease-out, box-shadow 140ms ease-out;
}
.topic-chip.is-active {
  border-color: rgba(114, 224, 209, 0.72);
  background: rgba(114, 224, 209, 0.12);
  box-shadow: inset 0 0 0 1px rgba(114, 224, 209, 0.18);
}
.topic-chip.is-selected {
  border-color: rgba(255, 200, 87, 0.86);
  background: rgba(255, 200, 87, 0.13);
  box-shadow: inset 0 0 0 1px rgba(255, 200, 87, 0.24);
}
.topic-chip img {
  width: var(--topic-icon-size);
  height: var(--topic-icon-size);
  border-radius: 50%;
  object-fit: cover;
}
.topic-chip span {
  display: -webkit-box;
  width: 100%;
  min-width: 0;
  overflow: hidden;
  color: rgba(255, 255, 255, 0.76);
  font-size: var(--topic-font-size);
  font-weight: 670;
  line-height: 1.02;
  text-align: center;
  overflow-wrap: anywhere;
  opacity: 1;
  pointer-events: none;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}
.topic-chip.is-active span,
.topic-chip.is-selected span {
  color: rgba(255, 255, 255, 0.96);
}
.transcript-content {
  max-width: 760px;
  margin: 0 auto;
}
.transcript-section {
  padding: 0 0 14px;
}
.transcript-section + .transcript-section {
  padding-top: 4px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}
.transcript-section-title {
  margin: 0 0 11px;
  color: rgba(255, 255, 255, 0.94);
  font-size: 17px;
  line-height: 1.25;
  letter-spacing: 0;
}
.transcript-paragraph {
  position: relative;
  margin: 0 0 12px;
  padding: 7px 8px 7px 0;
  border-left: 2px solid transparent;
  border-radius: 0 7px 7px 0;
  color: rgba(255, 255, 255, 0.78);
  font-size: 14px;
  line-height: 1.58;
}
.transcript-paragraph[data-start] {
  cursor: pointer;
}
.transcript-paragraph.is-active:not(.has-active-sentence) {
  border-left-color: rgba(114, 224, 209, 0.78);
  background: rgba(114, 224, 209, 0.08);
  color: #fff;
}
.paragraph-time {
  display: inline-block;
  min-width: 38px;
  margin: 0 7px 0 0;
  color: var(--accent-2);
  font-size: 11px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  opacity: 0;
  transition: opacity 140ms ease-out;
}
.transcript-paragraph:hover .paragraph-time,
.transcript-paragraph:focus .paragraph-time,
.transcript-paragraph:focus-within .paragraph-time {
  opacity: 1;
}
.transcript-sentence {
  border-radius: 5px;
  padding: 1px 2px;
  margin: 0 -1px;
  cursor: pointer;
}
.transcript-sentence:hover {
  background: rgba(255, 255, 255, 0.08);
}
.transcript-sentence.is-active {
  background: rgba(114, 224, 209, 0.19);
  box-shadow: 0 0 0 1px rgba(114, 224, 209, 0.38);
  color: #fff;
}
.transcript strong {
  color: rgba(255, 255, 255, 0.96);
}
.transcript code {
  padding: 1px 4px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.08);
  color: rgba(255, 255, 255, 0.88);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.92em;
}
.transcript a {
  color: var(--accent);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.mobile-topbar,
.current-topic-card,
.mobile-mode-nav {
  display: none;
}
.topic-search {
  display: none;
}
.topic-chip .topic-chip-description,
.topic-chip .topic-chip-time {
  display: none;
}
@media (max-width: 1100px), (max-height: 620px) {
  html,
  body {
    height: 100%;
    min-height: 100%;
    overflow: hidden;
  }
  .app,
  .app.has-custom-columns {
    --slot-gap: clamp(4px, 1.1vmin, 8px);
    --edge-pad: clamp(5px, 1.2vmin, 8px);
    --topbar-height: clamp(28px, 4.8vmin, 34px);
    --nav-height: clamp(40px, 7vmin, 48px);
    position: relative;
    width: 100vw;
    height: 100dvh;
    min-height: 0;
    display: grid;
    gap: var(--slot-gap);
    padding: var(--edge-pad);
    overflow: hidden;
    background: #000;
  }
  .vertical-splitter,
  .horizontal-splitter,
  .lower-splitter {
    display: none;
  }
  .mobile-topbar,
  .video-wrap,
  .map-stage,
  .chapter-strip,
  .current-topic-card,
  .mobile-mode-nav,
  .navigation-panel,
  .transcript {
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: clamp(10px, 2.3vmin, 16px);
    background: rgba(6, 8, 8, 0.96);
  }
  .mobile-topbar {
    grid-area: top;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto 28px;
    align-items: center;
    gap: 8px;
    height: var(--topbar-height);
    padding: 0 clamp(8px, 2vmin, 12px);
  }
  .mobile-topbar-title {
    min-width: 0;
    overflow: hidden;
    font-size: clamp(11px, 2.7vmin, 14px);
    font-weight: 850;
    line-height: 1.05;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .mobile-topbar-mode {
    color: var(--accent);
    font-size: clamp(11px, 2.7vmin, 14px);
    font-weight: 900;
    line-height: 1;
    white-space: nowrap;
  }
  .mobile-menu-button {
    width: 28px;
    height: 24px;
    padding: 0;
    border: 0;
    background: transparent;
    color: rgba(255, 255, 255, 0.58);
    font-size: 15px;
    font-weight: 900;
  }
  .media-panel,
  .media-panel.has-custom-rows {
    display: contents;
    background: transparent;
    border: 0;
  }
  .media-panel.has-custom-rows .video-wrap,
  .video-wrap {
    grid-area: video;
    position: relative;
    width: 100%;
    height: 100%;
    aspect-ratio: auto;
  }
  video {
    width: 100%;
    height: 100%;
    max-height: none;
    aspect-ratio: auto;
    object-fit: contain;
  }
  .caption-overlay {
    bottom: 38px;
    max-width: calc(100% - 20px);
    padding: 5px 8px;
    border-radius: 8px;
    font-size: clamp(11px, 2.5vmin, 14px);
    line-height: 1.25;
  }
  .map-stage {
    grid-area: map;
    position: relative;
  }
  #viewport {
    border-radius: inherit;
  }
  .lower {
    display: contents;
  }
  .navigation-panel,
  .transcript {
    display: none;
  }
  .chapter-strip {
    grid-area: chapters;
    padding: 4px;
    background: rgba(8, 10, 10, 0.96);
  }
  .nav-undo {
    display: none;
  }
  .chapter-list {
    width: 100%;
    height: 100%;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(84px, 1fr);
    grid-template-columns: none;
    gap: 5px;
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior-inline: contain;
    scrollbar-width: thin;
    scrollbar-color: rgba(114, 224, 209, 0.52) transparent;
  }
  .chapter-list::-webkit-scrollbar {
    height: 4px;
  }
  .chapter-card {
    display: grid;
    grid-template-rows: minmax(22px, 0.52fr) minmax(0, 1fr);
    justify-items: center;
    align-items: center;
    height: 100%;
    min-height: 0;
    padding: 4px 5px;
    gap: 2px;
    border-radius: 9px;
  }
  .chapter-icon {
    width: clamp(22px, 5.4vmin, 31px);
    height: clamp(22px, 5.4vmin, 31px);
  }
  .chapter-number {
    top: 3px;
    left: 4px;
    font-size: 9px;
  }
  .chapter-label {
    font-size: clamp(9px, 2.1vmin, 12px);
    line-height: 1.12;
    -webkit-line-clamp: 2;
  }
  .current-topic-card {
    grid-area: topic;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 40px;
    align-items: center;
    gap: 8px;
    padding: clamp(7px, 1.8vmin, 11px) clamp(9px, 2.2vmin, 14px);
    background: linear-gradient(120deg, rgba(15, 19, 18, 0.98), rgba(7, 8, 8, 0.97));
  }
  .current-topic-card h2 {
    margin: 0 0 3px;
    overflow: hidden;
    color: var(--text);
    font-size: clamp(14px, 3vmin, 18px);
    line-height: 1.08;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .current-topic-meta {
    margin: 0 0 3px;
    overflow: hidden;
    color: var(--accent-2);
    font-size: clamp(10px, 2.35vmin, 13px);
    font-weight: 850;
    line-height: 1.05;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .current-topic-description {
    display: -webkit-box;
    margin: 0;
    overflow: hidden;
    color: var(--muted);
    font-size: clamp(10px, 2.2vmin, 13px);
    line-height: 1.22;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }
  .current-topic-action {
    display: grid;
    place-items: center;
    width: clamp(32px, 7vmin, 40px);
    height: clamp(32px, 7vmin, 40px);
    border: 1px solid rgba(114, 224, 209, 0.58);
    border-radius: 12px;
    background: rgba(114, 224, 209, 0.12);
    color: var(--accent);
    font-size: 17px;
    font-weight: 900;
  }
  .mobile-mode-nav {
    grid-area: nav;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    align-items: stretch;
    height: var(--nav-height);
    padding: 4px;
    gap: 4px;
    background: rgba(4, 6, 6, 0.96);
  }
  .mobile-mode-button {
    min-width: 0;
    min-height: 0;
    padding: 0 4px;
    border: 0;
    border-radius: 14px;
    background: transparent;
    color: rgba(255, 255, 255, 0.66);
    font-size: clamp(10px, 2.4vmin, 13px);
    font-weight: 850;
  }
  .mobile-mode-button.is-active {
    border: 1px solid rgba(114, 224, 209, 0.96);
    background: rgba(14, 82, 75, 0.72);
    color: #fff;
  }
  .topic-search {
    display: grid;
  }

 is a biographical semantic map of people, places, events, institutions, possessions, illnesses, anxieties, and historical episodes connected with Samuel Pepys. It demonstrates how a life can be arranged as navigable conceptual terrain.","x":117.50937493223464,"y":231.82362604415812,"importanceScore":0.373375,"distinctivenessScore":0.354842,"displayScore":0.37478,"iconSrc":"../../images/samuel-pepys-life-map.webp","embeddingOrder":4},{"id":"pandemic-and-biorisk-collaboration","title":"Pandemic and Biorisk Collaboration","label":"Biorisk Collab","cluster":"collective-sensemaking","rank":3,"centrality":6,"description":"Pandemic and biorisk collaboration requires clinicians, modellers, biosecurity specialists, policy experts, communicators, and institutions to share fast-changing knowledge. Visual threat maps can reveal risks, responsibilities, dependencies, uncertainty, and urgent coordination needs.","x":137.62551234478292,"y":341.5420496661678,"importanceScore":0.54275,"distinctivenessScore":0.584311,"displayScore":0.58651,"iconSrc":"../../images/pandemic-and-biorisk-collaboration.webp","embeddingOrder":5},{"id":"historical-catastrophe-landmark","title":"Historical Catastrophe Landmark","label":"Catastrophe","cluster":"case-study","rank":5,"centrality":5,"description":"A historical catastrophe landmark is a disaster event that becomes a major emotional and spatial anchor in a historical or biographical map. It captures destruction, fear, displacement, civic memory, rebuilding, and the way catastrophe reorganises attention.","x":151.58641515035353,"y":161.05667919100844,"importanceScore":0.19125,"distinctivenessScore":0.809344,"displayScore":0.81239,"iconSrc":"../../images/historical-catastrophe-landmark.webp","embeddingOrder":6},{"id":"person-specific-meaning","title":"Person-Specific Meaning","label":"Personal Meaning","cluster":"shared-semantic-geometry","rank":2,"centrality":8,"description":"Person-specific meaning is the way a concept gains different salience, emotion, memory, context, and association for different individuals. It matters for biographical maps, personal knowledge systems, recommendation, education, and humane comparison of lived experience.","x":161.30481761162125,"y":421.012591895961,"importanceScore":0.767625,"distinctivenessScore":0.452531,"displayScore":0.770514,"iconSrc":"../../images/person-specific-meaning.webp","embeddingOrder":7},{"id":"mental-model-building","title":"Mental Model Building","label":"Mental Models","cluster":"mental-models","rank":1,"centrality":10,"description":"Mental model building is the process of forming a usable internal representation of a complex situation, domain, or system. It supports judgement, planning, explanation, memory, and action by organising scattered facts, relationships, uncertainties, and priorities into a coherent understanding.","x":186.5203909491233,"y":614.9505153524696,"importanceScore":0.9925,"distinctivenessScore":0.765321,"displayScore":0.996236,"iconSrc":"../../images/mental-model-building.webp","embeddingOrder":8},{"id":"interpretability-and-ai-safety","title":"Interpretability and AI Safety","label":"AI Interpretability","cluster":"shared-semantic-geometry","rank":2,"centrality":8,"description":"Interpretability and AI safety concern understanding what AI systems internally represent, how those representations influence behaviour, and where risks may arise. The goal is to improve reliability, debugging, alignment, oversight, misuse prevention, and responsible deployment.","x":199.37710247690794,"y":536.7882890723672,"importanceScore":0.767625,"distinctivenessScore":0.305836,"displayScore":0.770514,"iconSrc":"../../images/interpretability-and-ai-safety.webp","embeddingOrder":9},{"id":"cross-specialist-collaboration","title":"Cross-Specialist Collaboration","label":"Specialist Collab","cluster":"collective-sensemaking","rank":2,"centrality":8,"description":"Cross-specialist collaboration is the coordination challenge faced by people with different expertise, evidence, vocabulary, incentives, and responsibilities. Visual maps can expose dependencies, gaps, conflicts, shared reference points, and opportunities for synthesis.","x":219.46983515570875,"y":406.28737766675226,"importanceScore":0.767625,"distinctivenessScore":0.275869,"displayScore":0.770514,"iconSrc":"../../images/cross-specialist-collaboration.webp","embeddingOrder":10},{"id":"collective-sensemaking-tools","title":"Collective Sensemaking Tools","label":"Collective Tools","cluster":"collective-sensemaking","rank":1,"centrality":10,"description":"Collective sensemaking tools help groups build, compare, revise, and act on shared understanding of complex domains. They connect individual mental models with deliberation, education, coordination, disagreement, memory, accountability, and cooperative action.","x":223.99501974062184,"y":482.07120444976476,"importanceScore":0.99625,"distinctivenessScore":0.382625,"displayScore":1.0,"iconSrc":"../../images/collective-sensemaking-tools.webp","embeddingOrder":11},{"id":"prototype-first-steps","title":"Prototype First Steps","label":"First Steps","cluster":"case-study","rank":4,"centrality":6,"description":"Prototype first steps describe an early but functional system that demonstrates a promising direction while leaving major design, evaluation, interaction, and product questions open. It signals credible progress, incomplete polish, and a path for iterative development.","x":237.43642943541437,"y":583.1724293229054,"importanceScore":0.380875,"distinctivenessScore":0.430109,"displayScore":0.431728,"iconSrc":"../../images/prototype-first-steps.webp","embeddingOrder":12},{"id":"category-boundaries","title":"Category Boundaries","label":"Boundaries","cluster":"semantic-map-layout","rank":3,"centrality":7,"description":"Category boundaries are visible enclosures such as boxes, contours, hulls, borders, or shaded areas that show which items belong together. They make cluster membership legible, separate neighbouring territories, and help viewers read conceptual structure spatially.","x":290.1694323337367,"y":406.6696872631327,"importanceScore":0.563,"distinctivenessScore":0.239236,"displayScore":0.565119,"iconSrc":"../../images/category-boundaries.webp","embeddingOrder":13},{"id":"salience-rank-scale-opacity","title":"Salience, Rank, Scale, and Opacity","label":"Visual Priority","cluster":"visual-language-zui","rank":1,"centrality":9,"description":"Salience, rank, scale, and opacity are visual priority signals that control which topics appear large, bright, faint, foregrounded, or hidden. They encode attention, importance, centrality, context, and zoom level without forcing every priority into one score.","x":310.56707762753376,"y":293.4778997764528,"importanceScore":0.9535,"distinctivenessScore":0.092288,"displayScore":0.957089,"iconSrc":"../../images/salience-rank-scale-opacity.webp","embeddingOrder":14},{"id":"moving-things-as-thinking","title":"Moving Things as Thinking","label":"Move to Think","cluster":"expressive-interface","rank":1,"centrality":9,"description":"Moving things as thinking is the cognitive practice of using spatial rearrangement to compare, test, refine, and discover relationships. Physically or digitally moving concepts can make implicit associations visible and support reasoning through external structure.","x":315.93009591522116,"y":496.95752308430104,"importanceScore":0.961,"distinctivenessScore":0.323521,"displayScore":0.964617,"iconSrc":"../../images/moving-things-as-thinking.webp","embeddingOrder":15},{"id":"topic-map-as-medium","title":"Topic Map as Medium","label":"Map Medium","cluster":"mental-models","rank":1,"centrality":10,"description":"A topic map as medium is a spatial surface where concepts, entities, events, and relationships become landmarks, paths, neighbourhoods, and regions. It supports navigation, comparison, explanation, memory, collaboration, and expressive arrangement of meaning.","x":317.2109703850607,"y":353.1089224829895,"importanceScore":0.9925,"distinctivenessScore":0.053896,"displayScore":0.996236,"iconSrc":"../../images/topic-map-as-medium.webp","embeddingOrder":16},{"id":"regions-not-points","title":"Regions Not Points","label":"Regions","cluster":"semantic-map-layout","rank":2,"centrality":8,"description":"Regions not points is the idea that concepts and categories can occupy visible areas rather than zero-size coordinates. It supports boundaries, territory, membership, overlap, enclosure, influence, and map-like interpretation of conceptual space.","x":337.72332712359474,"y":239.97519598208564,"importanceScore":0.756375,"distinctivenessScore":0.126535,"displayScore":0.759222,"iconSrc":"../../images/regions-not-points.webp","embeddingOrder":17},{"id":"calendar-concept-shapes","title":"Calendar Concept Shapes","label":"Calendar Shapes","cluster":"shared-semantic-geometry","rank":4,"centrality":5,"description":"Calendar concept shapes are geometric structures representing ordered temporal ideas such as dates, months, or weekdays inside a model’s internal space. They provide a concrete example of familiar conceptual sequences appearing as learned spatial patterns.","x":343.28569885108215,"y":608.7498709108157,"importanceScore":0.334375,"distinctivenessScore":0.532474,"displayScore":0.534478,"iconSrc":"../../images/calendar-concept-shapes.webp","embeddingOrder":18},{"id":"orientation-stability","title":"Orientation Stability","label":"Stable Orientation","cluster":"semantic-map-layout","rank":2,"centrality":8,"description":"Orientation stability is the property that a regenerated map keeps familiar direction, landmarks, and spatial memory across updates. It helps users compare versions, recognise regions, trust continuity, and add or remove topics without losing orientation.","x":361.8455086648227,"y":184.34161359372945,"importanceScore":0.756375,"distinctivenessScore":0.22784,"displayScore":0.759222,"iconSrc":"../../images/orientation-stability.webp","embeddingOrder":19},{"id":"generated-topic-icons","title":"Generated Topic Icons","label":"Topic Icons","cluster":"visual-language-zui","rank":2,"centrality":8,"description":"Generated topic icons are small topic-specific images created or selected to make abstract or textual concepts recognisable. They improve scanning, memory, emotional tone, visual differentiation, landmark formation, and zoomable navigation when paired with labels and placement.","x":367.0697714032113,"y":432.31813860067615,"importanceScore":0.763875,"distinctivenessScore":0.045584,"displayScore":0.76675,"iconSrc":"../../images/generated-topic-icons.webp","embeddingOrder":20},{"id":"information-murals-and-mess-maps","title":"Information Murals and Mess Maps","label":"Info Murals","cluster":"collective-sensemaking","rank":2,"centrality":8,"description":"Information murals and mess maps are large visual artefacts that combine text, diagrams, categories, timelines, images, evidence, and relationships. They help groups examine complexity, preserve context, surface disagreements, and build shared understanding.","x":367.3052861918878,"y":313.0759316162809,"importanceScore":0.763875,"distinctivenessScore":0.052625,"displayScore":0.76675,"iconSrc":"../../images/information-murals-and-mess-maps.webp","embeddingOrder":21},{"id":"cross-model-geometric-patterns","title":"Cross-Model Geometric Patterns","label":"Cross-Model Shapes","cluster":"shared-semantic-geometry","rank":2,"centrality":8,"description":"Cross-model geometric patterns are recurring internal structures found across different trained models. They suggest that independently learned systems may converge on similar representational organisation for meaning, order, category, relation, or behaviour.","x":369.92966671974835,"y":554.9902189754323,"importanceScore":0.760125,"distinctivenessScore":0.150855,"displayScore":0.762986,"iconSrc":"../../images/cross-model-geometric-patterns.webp","embeddingOrder":22},{"id":"topics-as-recognisable-entities","title":"Topics as Recognisable Entities","label":"Topic Entities","cluster":"visual-language-zui","rank":2,"centrality":8,"description":"Topics as recognisable entities are abstract concepts rendered as memorable visual objects through icons, labels, scale, position, and style. This makes a semantic map feel like a navigable environment with landmarks rather than a plain scatterplot.","x":373.91886048123786,"y":372.7103272098747,"importanceScore":0.763875,"distinctivenessScore":0.0,"displayScore":0.76675,"iconSrc":"../../images/topics-as-recognisable-entities.webp","embeddingOrder":23},{"id":"shared-representational-geometry","title":"Shared Representational Geometry","label":"Shared Geometry","cluster":"shared-semantic-geometry","rank":1,"centrality":10,"description":"Shared representational geometry is the idea that learned systems may contain structured shapes for concepts, sequences, categories, and behaviours. It links semantic maps, embeddings, neural representations, interpretability, transfer, and cross-model comparison.","x":375.69880734425584,"y":491.6943887986846,"importanceScore":0.98875,"distinctivenessScore":0.087928,"displayScore":0.992472,"iconSrc":"../../images/shared-representational-geometry.webp","embeddingOrder":24},{"id":"voronoi-topic-regions","title":"Voronoi Topic Regions","label":"Voronoi Regions","cluster":"semantic-map-layout","rank":5,"centrality":5,"description":"Voronoi topic regions divide a map into cells around topic centres, where each position belongs to the nearest centre. They can visualise local territory, neighbourhood influence, screen-space ownership, and approximate conceptual regions around individual topics.","x":397.5853367865183,"y":235.90828206239323,"importanceScore":0.16875,"distinctivenessScore":0.1207,"displayScore":0.169385,"iconSrc":"../../images/voronoi-topic-regions.webp","embeddingOrder":25},{"id":"cross-lingual-semantic-shapes","title":"Cross-Lingual Semantic Shapes","label":"Language Shapes","cluster":"shared-semantic-geometry","rank":2,"centrality":9,"description":"Cross-lingual semantic shapes are comparable representational structures for meanings expressed in different languages. They concern shared conceptual geometry beneath different vocabularies, scripts, grammars, translations, cultural contexts, and multilingual communication.","x":417.8772440935997,"y":592.4267282761567,"importanceScore":0.799125,"distinctivenessScore":0.218911,"displayScore":0.802133,"iconSrc":"../../images/cross-lingual-semantic-shapes.webp","embeddingOrder":26},{"id":"map-as-expressive-interface","title":"Map as Expressive Interface","label":"Expressive Map","cluster":"expressive-interface","rank":1,"centrality":10,"description":"A map as expressive interface is a visual system used not only to view information but to compose meaning. Selection, grouping, placement, proximity, annotation, and rearrangement become acts of explanation, argument, storytelling, and design.","x":422.3459365849002,"y":337.2869115509764,"importanceScore":0.9925,"distinctivenessScore":0.040652,"displayScore":0.996236,"iconSrc":"../../images/map-as-expressive-interface.webp","embeddingOrder":27},{"id":"visual-linguistic-themes","title":"Visual-Linguistic Themes","label":"Visual Themes","cluster":"visual-language-zui","rank":3,"centrality":7,"description":"Visual-linguistic themes are recurring meaning patterns expressed through both words and images, such as food, fire, trade, danger, status, work, or domestic life. They align labels, icons, colour, metaphor, and spatial placement into a coherent visual vocabulary.","x":423.6029609252633,"y":527.8218474650142,"importanceScore":0.56675,"distinctivenessScore":0.126024,"displayScore":0.568883,"iconSrc":"../../images/visual-linguistic-themes.webp","embeddingOrder":28},{"id":"semantic-spaces-made-intelligible","title":"Semantic Spaces Made Intelligible","label":"Intelligible Spaces","cluster":"mental-models","rank":1,"centrality":10,"description":"Semantic spaces made intelligible are hidden meaning structures transformed into visible, interpretable forms. The concept joins machine-readable embeddings with human-readable maps, labels, regions, icons, and explanations so complex conceptual relationships can be inspected and discussed.","x":424.4513201282612,"y":455.349638835932,"importanceScore":0.98875,"distinctivenessScore":0.067975,"displayScore":0.992472,"iconSrc":"../../images/semantic-spaces-made-intelligible.webp","embeddingOrder":29},{"id":"overlap-problem","title":"Overlap Problem","label":"Overlap","cluster":"semantic-map-layout","rank":1,"centrality":9,"description":"The overlap problem occurs when projected topics, labels, icons, or cards occupy the same visible area and become hard to read. It arises because mathematical points have no size, while real interface elements need screen space and collision handling.","x":430.06414226030853,"y":185.4590165078205,"importanceScore":0.9535,"distinctivenessScore":0.208086,"displayScore":0.957089,"iconSrc":"../../images/overlap-problem.webp","embeddingOrder":30},{"id":"semantic-integrity","title":"Semantic Integrity","label":"Semantic Integrity","cluster":"semantic-map-layout","rank":1,"centrality":10,"description":"Semantic integrity is the quality of a visual layout where distance, grouping, and neighbourhood still reflect meaningful conceptual relationships. It prevents readability improvements, aesthetic tidying, or collision removal from destroying the map’s underlying meaning.","x":434.47078255263625,"y":396.19212390564917,"importanceScore":0.985,"distinctivenessScore":0.061068,"displayScore":0.988708,"iconSrc":"../../images/semantic-integrity.webp","embeddingOrder":31},{"id":"progressive-zoom-disclosure","title":"Progressive Zoom Disclosure","label":"Zoom Disclosure","cluster":"visual-language-zui","rank":2,"centrality":8,"description":"Progressive zoom disclosure reveals information gradually as scale increases. A distant view shows major landmarks and broad structure, while closer views reveal additional topics, labels, icons, edges, examples, regions, and fine-grained semantic detail.","x":438.73947388245864,"y":279.56990249061664,"importanceScore":0.760125,"distinctivenessScore":0.092772,"displayScore":0.762986,"iconSrc":"../../images/progressive-zoom-disclosure.webp","embeddingOrder":32},{"id":"semantic-embeddings","title":"Semantic Embeddings","label":"Embeddings","cluster":"semantic-map-layout","rank":1,"centrality":10,"description":"Semantic embeddings are numerical vector representations that place texts, topics, images, or concepts near others with related meaning. They enable similarity search, clustering, retrieval, recommendation, projection, topic mapping, and computational treatment of conceptual relationships.","x":472.05682602135926,"y":563.2085951247442,"importanceScore":0.9775,"distinctivenessScore":0.170983,"displayScore":0.981179,"iconSrc":"../../images/semantic-embeddings.webp","embeddingOrder":33},{"id":"high-bandwidth-visual-cognition","title":"High-Bandwidth Visual Cognition","label":"Visual Cognition","cluster":"mental-models","rank":1,"centrality":9,"description":"High-bandwidth visual cognition is the human capacity to process spatial layout, shape, colour, contrast, scale, motion, and pattern rapidly through sight. It makes diagrams, maps, icons, and visual structure powerful tools for understanding many relationships at once.","x":473.7255646522756,"y":489.5848509573171,"importanceScore":0.95725,"distinctivenessScore":0.200655,"displayScore":0.960853,"iconSrc":"../../images/high-bandwidth-visual-cognition.webp","embeddingOrder":34},{"id":"semantic-aware-multi-stage-layout","title":"Semantic-Aware Multi-Stage Layout","label":"Aware Layout","cluster":"semantic-map-layout","rank":1,"centrality":10,"description":"Semantic-aware multi-stage layout is a method for producing readable maps by resolving visual collisions while preserving conceptual relationships. It combines projection, overlap removal, semantic constraints, ranking, and stability so the display remains both legible and meaningful.","x":481.9930431032795,"y":343.7848599688826,"importanceScore":0.98875,"distinctivenessScore":0.083544,"displayScore":0.992472,"iconSrc":"../../images/semantic-aware-multi-stage-layout.webp","embeddingOrder":35},{"id":"force-directed-layout-risk","title":"Force-Directed Layout Risk","label":"Force Risk","cluster":"semantic-map-layout","rank":3,"centrality":7,"description":"Force-directed layout risk is the danger that simulated node repulsion can improve visual spacing while weakening semantic accuracy. When repelled nodes drift away from meaningful neighbours, the display may become cleaner but less trustworthy as a map of meaning.","x":482.2520923180348,"y":227.8775021242847,"importanceScore":0.563,"distinctivenessScore":0.226906,"displayScore":0.565119,"iconSrc":"../../images/force-directed-layout-risk.webp","embeddingOrder":36},{"id":"two-point-rotation-anchor","title":"Two-Point Rotation Anchor","label":"Rotation Anchor","cluster":"semantic-map-layout","rank":4,"centrality":6,"description":"A two-point rotation anchor is a layout alignment technique that uses two stable reference topics to determine map rotation after regeneration. It reduces random orientation changes and preserves visual continuity across stochastic projection or layout runs.","x":484.9039267246629,"y":161.11567729832146,"importanceScore":0.362125,"distinctivenessScore":0.361043,"displayScore":0.363488,"iconSrc":"../../images/two-point-rotation-anchor.webp","embeddingOrder":37},{"id":"abstraction-levels","title":"Abstraction Levels","label":"Abstraction","cluster":"visual-language-zui","rank":2,"centrality":8,"description":"Abstraction levels describe how concrete or symbolic a representation is, from realistic image to simplified icon, diagrammatic mark, category label, or abstract symbol. The right level affects recognition speed, nuance, ambiguity, compactness, and zoom suitability.","x":496.5510244178974,"y":617.9811769011595,"importanceScore":0.756375,"distinctivenessScore":0.368004,"displayScore":0.759222,"iconSrc":"../../images/abstraction-levels.webp","embeddingOrder":38},{"id":"local-global-layout-tension","title":"Local-Global Layout Tension","label":"Local Global","cluster":"shared-semantic-geometry","rank":2,"centrality":8,"description":"Local-global layout tension is the trade-off where a projection preserves nearby relationships but distorts the overall shape of a dataset. It matters when a map must support both neighbourhood inspection and reliable interpretation of global conceptual structure.","x":498.40231149303537,"y":285.9217688217065,"importanceScore":0.756375,"distinctivenessScore":0.12376,"displayScore":0.759222,"iconSrc":"../../images/local-global-layout-tension.webp","embeddingOrder":39},{"id":"visual-language-grammar","title":"Visual Language Grammar","label":"Visual Grammar","cluster":"collective-sensemaking","rank":1,"centrality":10,"description":"Visual language grammar is the structured use of text, images, icons, arrows, regions, scale, colour, layout, and abstraction to communicate meaning. It turns visual artefacts into interpretable explanations rather than decorative collections of marks.","x":532.0561102325214,"y":563.5043045910378,"importanceScore":0.98875,"distinctivenessScore":0.200702,"displayScore":0.992472,"iconSrc":"../../images/visual-language-grammar.webp","embeddingOrder":40},{"id":"raw-projection-messiness","title":"Raw Projection Messiness","label":"Projection Mess","cluster":"semantic-map-layout","rank":1,"centrality":9,"description":"Raw projection messiness is the unreadable display that often results when high-dimensional semantic data is projected directly into two dimensions. It includes crowding, overlap, unstable orientation, misleading distances, tangled labels, and ambiguous visual groupings.","x":541.8193766797132,"y":339.2230418600522,"importanceScore":0.9535,"distinctivenessScore":0.135916,"displayScore":0.957089,"iconSrc":"../../images/raw-projection-messiness.webp","embeddingOrder":41},{"id":"reverse-projection","title":"Reverse Projection","label":"Reverse Projection","cluster":"expressive-interface","rank":2,"centrality":9,"description":"Reverse projection estimates a high-dimensional representation from a chosen low-dimensional map position. It allows manual placement to become a semantic query about what an object would mean relative to existing concepts, examples, and embedding geometry.","x":555.4009651353508,"y":397.6656681310232,"importanceScore":0.791625,"distinctivenessScore":0.303276,"displayScore":0.794605,"iconSrc":"../../images/reverse-projection.webp","embeddingOrder":42},{"id":"zoomable-user-interface","title":"Zoomable User Interface","label":"ZUI","cluster":"visual-language-zui","rank":1,"centrality":10,"description":"A zoomable user interface is an information space where users move between overview and detail by zooming. It supports landmarks, progressive disclosure, local inspection, nested structure, scale-dependent labels, and navigation through large visual knowledge maps.","x":557.8903575158732,"y":200.59204113056282,"importanceScore":0.9925,"distinctivenessScore":0.427931,"displayScore":0.996236,"iconSrc":"../../images/zoomable-user-interface.webp","embeddingOrder":43},{"id":"paper-like-digital-canvas","title":"Paper-Like Digital Canvas","label":"Digital Canvas","cluster":"expressive-interface","rank":3,"centrality":6,"description":"A paper-like digital canvas preserves the freedom of arranging notes, images, sketches, and labels in open space while adding computational affordances. It supports provisional thinking, loose grouping, recomposition, annotation, search, zoom, and structured reuse.","x":558.2401834772569,"y":281.513790101247,"importanceScore":0.539,"distinctivenessScore":0.170126,"displayScore":0.541029,"iconSrc":"../../images/paper-like-digital-canvas.webp","embeddingOrder":44},{"id":"new-media-grammar","title":"New Media Grammar","label":"New Media Grammar","cluster":"collective-sensemaking","rank":2,"centrality":8,"description":"New media grammar is the emerging design language of generated images, embeddings, zoomable canvases, dynamic ranking, interactive maps, multimodal symbols, and adaptive interfaces. It extends older diagram traditions into computational and personalised media.","x":564.8489176072591,"y":513.2585820840574,"importanceScore":0.767625,"distinctivenessScore":0.376418,"displayScore":0.770514,"iconSrc":"../../images/new-media-grammar.webp","embeddingOrder":45},{"id":"robert-horn-visual-language","title":"Robert Horn Visual Language","label":"Horn Visual Language","cluster":"collective-sensemaking","rank":2,"centrality":8,"description":"Robert Horn visual language refers to a body of work on combining words, images, diagrams, symbols, layout, and abstraction into systematic visual communication. It provides historical grounding for information murals, knowledge maps, and text-image explanation.","x":591.6650800458688,"y":570.3432087710361,"importanceScore":0.763875,"distinctivenessScore":0.496437,"displayScore":0.76675,"iconSrc":"../../images/robert-horn-visual-language.webp","embeddingOrder":46},{"id":"drag-and-drop-arrangement","title":"Drag-and-Drop Arrangement","label":"Arrangement","cluster":"expressive-interface","rank":3,"centrality":7,"description":"Drag-and-drop arrangement is direct manipulation of images, labels, notes, concepts, or fragments on a spatial canvas. It preserves the expressive freedom of paper collage while adding digital search, linking, scaling, recomputation, and editable structure.","x":602.3693462101506,"y":240.8613946135896,"importanceScore":0.57425,"distinctivenessScore":0.223708,"displayScore":0.576412,"iconSrc":"../../images/drag-and-drop-arrangement.webp","embeddingOrder":47},{"id":"manifold-steering","title":"Manifold Steering","label":"Manifold Steering","cluster":"shared-semantic-geometry","rank":2,"centrality":8,"description":"Manifold steering studies structured geometric surfaces inside neural network representations and how movement through those surfaces relates to model behaviour. It treats behaviour as shaped by representation geometry rather than by isolated features alone.","x":606.0757248803163,"y":429.7915058605071,"importanceScore":0.760125,"distinctivenessScore":0.625898,"displayScore":0.762986,"iconSrc":"../../images/manifold-steering.webp","embeddingOrder":48},{"id":"screen-space-dimension","title":"Screen-Space Dimension","label":"Screen Space","cluster":"semantic-map-layout","rank":2,"centrality":8,"description":"Screen-space dimension is the practical requirement that visible interface objects need width, height, shape, padding, label room, and sometimes territorial area. It converts abstract coordinates into readable nodes, icons, labels, cards, clusters, and regions.","x":653.385565521185,"y":272.44217408566783,"importanceScore":0.752625,"distinctivenessScore":0.434389,"displayScore":0.755458,"iconSrc":"../../images/screen-space-dimension.webp","embeddingOrder":49},{"id":"dimensionality-reduction","title":"Dimensionality Reduction","label":"Dimensionality","cluster":"semantic-map-layout","rank":1,"centrality":10,"description":"Dimensionality reduction converts high-dimensional data into two-dimensional or three-dimensional coordinates for display, analysis, or exploration. It reveals visible patterns but also creates distortion because many hidden dimensions must be compressed into a limited visual space.","x":687.32602752035,"y":321.9199025095262,"importanceScore":0.9775,"distinctivenessScore":0.948556,"displayScore":0.981179,"iconSrc":"../../images/dimensionality-reduction.webp","embeddingOrder":50}],"topicSignals":{"model":"qwen3-embedding:8b","sampleStep":2.0,"topics":{"abstraction-levels":[[1090.0,0.0],[1092.0,0.103],[1094.0,0.306],[1096.0,0.384],[1098.0,0.384],[1116.0,0.384],[1118.0,0.307],[1120.0,0.104],[1122.0,0.008],[1217.599,0.0]],"biographical-salience":[[190.0,0.0],[192.0,0.054],[194.0,0.194 t":"I’m interested in how things like embeddings, generated categories, different kinds of relationships, and graph structures can be used to make useful visualisations that do not look like a mess.","start":27.647,"end":47.862,"startLabel":"00:00:27.647","endLabel":"00:00:47.862","score":null,"sentences":[{"id":"tidy:sentence:0011","text":"I’m interested in how things like embeddings, generated categories, different kinds of relationships, and graph structures can be used to make useful visualisations that do not look like a mess.","start":27.647,"end":47.862,"startLabel":"00:00:27.647","endLabel":"00:00:47.862","cueMatchScore":1.0}],"cueMatchScore":1.0}],"start":0.838,"end":47.862,"startLabel":"00:00:00.838","endLabel":"00:00:47.862","score":null},{"id":"tidy:section:003","heading":"🧩 Why the first map looks messy","paragraphs":[{"id":"tidy:paragraph:008","text":"Speaking of which, this looks like a mess.","start":48.421,"end":52.049,"startLabel":"00:00:48.421","endLabel":"00:00:52.049","score":null,"sentences":[{"id":"tidy:sentence:0012","text":"Speaking of which, this looks like a mess.","start":48.421,"end":52.049,"startLabel":"00:00:48.421","endLabel":"00:00:52.049","cueMatchScore":1.0}],"cueMatchScore":1.0},{"id":"tidy:paragraph:009","text":"This is what happens when a data set of topics is projected down from high-dimensional space into 2D space. We should expect it to be a mess. We should expect overlap. By default, there is not a clean reduction down to two-dimensional space. That should not be surprising, but it is really annoying.","start":52.468,"end":84.135,"startLabel":"00:00:52.468","endLabel":"00:01:24.135","score":null,"sentences":[{"id":"tidy:sentence:0013","text":"This is what happens when a data set of topics is projected down from high-dimensional space into 2D space.","start":52.468,"end":67.333,"startLabel":"00:00:52.468","endLabel":"00:01:07.333","cueMatchScore":1.0},{"id":"tidy:sentence:0014","text":"We should expect it to be a mess.","start":67.363,"end":69.034,"startLabel":"00:01:07.363","endLabel":"00:01:09.034","cueMatchScore":1.0},{"id":"tidy:sentence:0015","text":"We should expect overlap.","start":69.064,"end":71.321,"startLabel":"00:01:09.064","endLabel":"00:01:11.321","cueMatchScore":1.0},{"id":"tidy:sentence:0016","text":"By default, there is not a clean reduction down to two-dimensional space.","start":73.155,"end":80.351,"startLabel":"00:01:13.155","endLabel":"00:01:20.351","cueMatchScore":1.0},{"id":"tidy:sentence:0017","text":"That should not be surprising, but it is really annoying.","start":80.381,"end":84.135,"startLabel":"00:01:20.381","endLabel":"00:01:24.135","cueMatchScore":1.0}],"cueMatchScore":1.0},{"id":"tidy:paragraph:010","text":"The reason this happens is that each item is mathematically just a point. It does not have any dimension in the two-dimensional representation unless that dimension is deliberately added.","start":84.602,"end":103.257,"startLabel":"00:01:24.602","endLabel":"00:01:43.257","score":null,"sentences":[{"id":"tidy:sentence:0018","text":"The reason this happens is that each item is mathematically just a point.","start":84.602,"end":88.738,"startLabel":"00:01:24.602","endLabel":"00:01:28.738","cueMatchScore":1.0},{"id":"tidy:sentence:0019","text":"It does not have any dimension in the two-dimensional representation unless that dimension is deliberately added.","start":88.768,"end":103.257,"startLabel":"00:01:28.768","endLabel":"00:01:43.257","cueMatchScore":1.0}],"cueMatchScore":1.0},{"id":"tidy:paragraph:011","text":"When we add that dimension, we then have to decide what to do about overlap. One common thing people do is use a force-directed effect: if one node is too close to another node, the nodes push themselves apart. But then we have to tweak all kinds of fiddly variables to keep the semantic integrity authentic.","start":103.289,"end":140.125,"startLabel":"00:01:43.289","endLabel":"00:02:20.125","score":null,"sentences":[{"id":"tidy:sentence:0020"," hing.","start":456.834,"end":471.225,"startLabel":"00:07:36.834","endLabel":"00:07:51.225","cueMatchScore":1.0}],"cueMatchScore":1.0},{"id":"tidy:paragraph:029","text":"There are two sides to every interface. So far, you have talked about what this interface is revealing, what it is showing, and how it relates to higher-dimensional spaces. I’m curious what you have thought about with respect to doing expressive work through this interface.","start":471.421,"end":487.325,"startLabel":"00:07:51.421","endLabel":"00:08:07.325","score":null,"sentences":[{"id":"tidy:sentence:0057","text":"There are two sides to every interface.","start":471.421,"end":474.181,"startLabel":"00:07:51.421","endLabel":"00:07:54.181","cueMatchScore":1.0},{"id":"tidy:sentence:0058","text":"So far, you have talked about what this interface is revealing, what it is showing, and how it relates to higher-dimensional spaces.","start":474.548,"end":480.261,"startLabel":"00:07:54.548","endLabel":"00:08:00.261","cueMatchScore":1.0},{"id":"tidy:sentence:0059","text":"I’m curious what you have thought about with respect to doing expressive work through this interface.","start":481.183,"end":487.325,"startLabel":"00:08:01.183","endLabel":"00:08:07.325","cueMatchScore":1.0}],"cueMatchScore":1.0}],"start":450.874,"end":487.325,"startLabel":"00:07:30.874","endLabel":"00:08:07.325","score":null},{"id":"tidy:section:007","heading":"🔁 Projecting back and arranging meaning","paragraphs":[{"id":"tidy:paragraph:030","text":"**Luke:** Yes. We can actually project back. There is a popular library called `UMAP Learn` that lets us do that.","start":488.095,"end":497.965,"startLabel":"00:08:08.095","endLabel":"00:08:17.965","score":null,"sentences":[{"id":"tidy:sentence:0060","text":"**Luke:** Yes.","start":488.095,"end":488.795,"startLabel":"00:08:08.095","endLabel":"00:08:08.795","cueMatchScore":1.0},{"id":"tidy:sentence:0061","text":"We can actually project back.","start":489.315,"end":491.986,"startLabel":"00:08:09.315","endLabel":"00:08:11.986","cueMatchScore":1.0},{"id":"tidy:sentence:0062","text":"There is a popular library called `UMAP Learn` that lets us do that.","start":492.087,"end":497.965,"startLabel":"00:08:12.087","endLabel":"00:08:17.965","cueMatchScore":1.0}],"cueMatchScore":1.0},{"id":"tidy:paragraph:031","text":"UMAP is a common solution for dimensionality reduction of high-dimensional data. It does not have a global objective. It is mostly local, which means it might mess up how things fit together in aggregate. That is not ideal.","start":498.64300000000003,"end":522.174,"startLabel":"00:08:18.643","endLabel":"00:08:42.174","score":null,"sentences":[{"id":"tidy:sentence:0063","text":"UMAP is a common solution for dimensionality reduction of high-dimensional data.","start":498.64300000000003,"end":505.901,"startLabel":"00:08:18.643","endLabel":"00:08:25.901","cueMatchScore":1.0},{"id":"tidy:sentence:0064","text":"It does not have a global objective.","start":506.261,"end":511.745,"startLabel":"00:08:26.261","endLabel":"00:08:31.745","cueMatchScore":1.0},{"id":"tidy:sentence:0065","text":"It is mostly local, which means it might mess up how things fit together in aggregate.","start":512.586,"end":520.395,"startLabel":"00:08:32.586","endLabel":"00:08:40.395","cueMatchScore":1.0},{"id":"tidy:sentence:0066","text":"That is not ideal.","start":520.5,"end":522.174,"startLabel":"00:08:40.500","endLabel":"00:08:42.174","cueMatchScore":1.0}],"cueMatchScore":1.0},{"id":"tidy:paragraph:032","text":"But one cool thing it can do is project back. It can let us predict what high-dimensional representation, or high-dimensional embedding, would make sense if, for example, I put something new here. What might it mean, based on everything else the system knows about the space? How might it relate to these personal things, these social things, and these work things?","start":522.204,"end":566.545,"startLabel":"00:08:42.204","endLabel":"00:09:26.545","score":null,"sentences":[{"id":"tidy:sentence:0067","text":"But one cool thing it can do is project back.","start":522.204,"end":533.925,"startLabel":"00:08:42.204","endLabel":"00:08:53.925","cueMatchScore":1.0},{"id":"tidy:sentence:0068","text":"It can let us predict what high-dimensional representation, or high-dimensional embedding, would make sense if, for example, I put something new here.","start":537.108,"end":548.985,"startLabel":"00:08:57.108","endLabel":"00:09:08.985","cueMatchScore":1.0},{"id":"tidy:sentence:0069","text":"What might it mean, based on everything else the system knows about the space?","start":549.322,"end":553.925,"startLabel":"00:09:09.322","endLabel":"00:09:13.925","cueMatchScore":1.0},{"id":"tidy:sentence:0070","text":"How might it relate to these personal things, these social things, and these work things?","start":554.646,"end":566.545,"startLabel":"00:09:14.646","endLabel":"00:09:26.545","cueMatchScore":1.0}],"cueMatchScore":1.0},{"id":"tidy:paragraph:033","text":"That can absolutely be done.","start":567.896,"end":568.845,"startLabel":"00:09:27.896","endLabel":"00:09:28.845","score":null,"sentences":[{"id":"tidy:sentence:0071","text":"That can absolutely be done.","start":567.896,"end":568.845,"startLabel":"00:09:27.896","endLabel":"00:09:28.845","cueMatchScore":1.0}],"cueMatchScore":1.0},{"id":"tidy:paragraph:034","text":"It is also sometimes useful to do drag-and-drop image-collage work. People often prefer paper for this kind of reason. It is a real pain, when working digitally, to lose the ability to arrange things freely.","start":568.875,"end":592.845,"startLabel":"00:09:28.875","endLabel":"00:09:52.845","score":null,"sentences":[{"id":"tidy:sentence:0072","text":"It is also sometimes useful to do drag-and-drop image-collage work.","start":568.875,"end":579.675,"startLabel":"00:09:28.875","endLabel":"00:09:39.675","cueMatchScore":1.0},{"id":"tidy:sentence:0073","text":"People often prefer paper for this kind of reason.","start":581.494,"end":584.815,"star ext":"I really liked what you mentioned about reverse-projecting into high-dimensional spaces.","start":673.447,"end":677.663,"startLabel":"00:11:13.447","endLabel":"00:11:17.663","cueMatchScore":1.0}],"cueMatchScore":1.0},{"id":"tidy:paragraph:040","text":"Mathematicians like to simplify things into spherical cows. When modelling things in 2D, we model everything as points. But in an actual 2D space, things also have dimensions. They have shapes.","start":682.122,"end":696.695,"startLabel":"00:11:22.122","endLabel":"00:11:36.695","score":null,"sentences":[{"id":"tidy:sentence:0084","text":"Mathematicians like to simplify things into spherical cows.","start":682.122,"end":685.992,"startLabel":"00:11:22.122","endLabel":"00:11:25.992","cueMatchScore":1.0},{"id":"tidy:sentence:0085","text":"When modelling things in 2D, we model everything as points.","start":686.312,"end":690.362,"startLabel":"00:11:26.312","endLabel":"00:11:30.362","cueMatchScore":1.0},{"id":"tidy:sentence:0086","text":"But in an actual 2D space, things also have dimensions.","start":690.422,"end":694.447,"startLabel":"00:11:30.422","endLabel":"00:11:34.447","cueMatchScore":1.0},{"id":"tidy:sentence:0087","text":"They have shapes.","start":695.105,"end":696.695,"startLabel":"00:11:35.105","endLabel":"00:11:36.695","cueMatchScore":1.0}],"cueMatchScore":1.0},{"id":"tidy:paragraph:041","text":"We also think in categories. On the screen, in a user interface, many of those things could be grouped together by putting them in a box, or surrounding them with a line. That is how many mind maps are presented.","start":696.974,"end":712.467,"startLabel":"00:11:36.974","endLabel":"00:11:52.467","score":null,"sentences":[{"id":"tidy:sentence:0088","text":"We also think in categories.","start":696.974,"end":699.083,"startLabel":"00:11:36.974","endLabel":"00:11:39.083","cueMatchScore":1.0},{"id":"tidy:sentence:0089","text":"On the screen, in a user interface, many of those things could be grouped together by putting nguages?","paragraphs":[{"id":"tidy:paragraph:049","text":"**Ivy Reese:** We have time for one more question.","start":801.205,"end":804.648,"startLabel":"00:13:21.205","endLabel":"00:13:24.648","score":null,"sentences":[{"id":"tidy:sentence:0104","text":"**Ivy Reese:** We have time for one more question.","start":801.205,"end":804.648,"startLabel":"00:13:21.205","endLabel":"00:13:24.648","cueMatchScore":1.0}],"cueMatchScore":1.0},{"id":"tidy:paragraph:050","text":"**Ivan Lugo:** I have a quick one too.","start":805.178,"end":807.062,"startLabel":"00:13:25.178","endLabel":"00:13:27.062","score":null,"sentences":[{"id":"tidy:sentence:0105","text":"**Ivan Lugo:** I have a quick one too.","start":805.178,"end":807.062,"startLabel":"00:13:25.178","endLabel":"00:13:27.062","cueMatchScore":1.0}],"cueMatchScore":1.0},{"id":"tidy:paragraph:051","text":"That last point about high dimensionality and language reminds me of an article I saw on Hacker News, or somewhere around there. It was an arXiv paper, and it talked about that very thing. Researchers had found that across a number of languages, there was a very definite pattern to certain words, word groups, and semantics.","start":807.437,"end":830.038,"startLabel":"00:13:27.437","endLabel":"00:13:50.038","score":null,"sentences":[{"id":"tidy:sentence:0106","text":"That last point about high dimensionality and language reminds me of an article I saw on Hacker News, or somewhere around there.","start":807.437,"end":816.468,"startLabel":"00:13:27.437","endLabel":"00:13:36.468","cueMatchScore":1.0},{"id":"tidy:sentence:0107","text":"It was an arXiv paper, and it talked about that very thing.","start":816.498,"end":820.5360000000001,"startLabel":"00:13:36.498","endLabel":"00:13:40.536","cueMatchScore":1.0},{"id":"tidy:sentence:0108","text":"Researchers had found that across a number of languages, there was a very definite pattern to certain words, word groups, and semantics.","start":822.159,"end":830.038,"startLabel":"00:13:42.159","endLabel":"00:13:50.038","cueMatchScore":1.0}],"cueMatchScore":1.0},{"id":"tidy:paragraph:052","text":"One thing that this project is showing is that this is a kind of language. I’m looking at Dining, Great Fire, and Prize Goods, and there is a certain visual theme and linguistic theme to it.","start":830.579,"end":843.079,"startLabel":"00:13:50.579","endLabel":"00:14:03.079","score":null,"sentences":[{"id":"tidy:sentence:0109","text":"One thing that this project is showing is that this is a kind of language.","start":830.579,"end":837.975,"startLabel":"00:13:50.579","endLabel":"00:13:57.975","cueMatchScore":1.0},{"id":"tidy:sentence:0110","text":"I’m looking at Dining, Great Fire, and Prize Goods, and there is a certain visual theme and linguistic theme to it.","start":838.215,"end":843.079,"startLabel":"00:13:58.215","endLabel":"00:14:03.079","cueMatchScore":1.0}],"cueMatchScore":1.0},{"id":"tidy:paragraph:053","text":"I’m curious because you have clearly operated on this from different texts and different spaces. Have you seen linguistic patterns in the way you have built this out? Have you tried to visualise that? For instance, in this case Dining means this, but for another person Dining means that. Have you been able to express that at all?","start":845.193,"end":869.282,"startLabel":"00:14:05.193","endLabel":"00:14:29.282","score":null,"sentences":[{"id":"tidy:sentence:0111","text":"I’m curious because you have clearly operated on this from different texts and different spaces.","start":845.193,"end":850.605,"startLabel":"00:14:05.193","endLabel":"00:14:10.605","cueMatchScore":1.0},{"id":"tidy:sentence:0112","text":"Have you seen linguistic patterns in the way you have built this out?","start":851.009,"end":856.5360000000001,"startLabel":"00:14:11.009","endLabel":"00:14:16.536","cueMatchScore":1.0},{"id":"tidy:sentence:0113","text":"Have you tried to visualise that?","start":856.566,"end":861.007,"startLabel":"00:14:16.566","endLabel":"00:14:21.007","cueMatchScore":1.0},{"id":"tidy:sentence:0114","text":"For instance, in this case Dining means this, but for another person Dining means that.","start":861.037,"end":865.972,"startLabel":"00:14:21.037","endLabel":"00:14:25.972","cueMatchScore":1.0},{"id":"tidy:sentence:0115","text":"Have you been able to express that at all?","start":866.102,"end":869.282,"startLabel":"00:14:26.102","endLabel":"00:14:29.282","cueMatchScore":1.0}],"cueMatchScore":1.0}],"start":801.205,"end":869.282,"startLabel":"00:13:21.205","endLabel":"00:14:29.282","score":null},{"id":"tidy:section:011","heading":"📐 MiniLM, salience, and Manifold Steering","paragraphs":[{"id":"tidy:paragraph:054","text":"**Luke:** One thing I was looking into was whether I could use off-the-shelf MiniLM embeddings to do salience prediction by extracting a few dimensions and maybe multiplying some of them together.","start":870.492,"end":891.756,"startLabel":"00:14:30.492","endLabel":"00:14:51.756","score":null,"sentences":[{"id":"tidy:sentence:0116","text":"**Luke:** One thing I was looking into was whether I could use off-the-shelf MiniLM embeddings to do salience prediction by extracting a few dimensions and maybe multiplying some of them together.","start":870.492,"end":891.756,"startLabel":"00:14:30.492","endLabel":"00:14:51.756","cueMatchScore":1.0}],"cueMatchScore":1.0},{"id":"tidy:paragraph:055","text":"That worked pretty well.","start":893.344,"end":894.5409999999999,"startLabel":"00:14:53.344","endLabel":"00:14:54.541","score":null,"sentences":[{"id":"tidy:sentence:0117","text":"That worked pretty well.","start":893.344,"end":894.5409999999999,"startLabel":"00:14:53.344","endLabel":"00:14:54.541","cueMatchScore":1.0}],"cueMatchScore":1.0},{"id":"tidy:paragraph:056","text":"I would have a data set of different kinds of life events at different scales. Then we could zoom in on ways to slice the normal embeddings we get for a piece of text, and use that to predict something like salience in a really efficient way.","start":894.571,"end":918.641,"startLabel":"00:14:54.571","endLabel":"00:15:18.641","score":null,"sentences":[{"id":"tidy:sentence:0118","text":"I would have a data set of different kinds of life events at different scales.","start":894.571,"end":900.916,"startLabel":"00:14:54.571","endLabel":"00:15:00.916","cueMatchScore":1.0},{"id":"tidy:sentence:0119","text":"Then we could zoom in on ways to slice the normal embeddings we get for a piece of text, and use that to predict something like salience in a really efficient way.","start":903.408,"end":918.641,"startLabel":"00:15:03.408","endLabel":"00:15:18.641","cueMatchScore":1.0}],"cueMatchScore":1.0},{"id":"tidy:paragraph:057","text":"Then the Manifold Steering paper came out. It basically showed things like different dates mapping to a particular shape inside large language models. They look at things like weekdays in different language models corresponding to certain shapes.","start":922.115,"end":946.725,"startLabel":"00:15:22.115","endLabel":"00:15:46.725","score":null,"sentences":[{"id":"tidy:sentence:0120","text":"Then the Manifold Steering paper came out.","start":922.115,"end":926.162,"startLabel":"00:15:22.115","endLabel":"00:15:26.162","cueMatchScore":1.0},{"id":"tidy:sentence:0121","text":"It basically showed things like different dates mapping to a particular shape inside large language models.","start":926.504,"end":937.268,"startLabel":"00:15:26.504","endLabel":"00:15:37.268","cueMatchScore":1.0},{"id":"tidy:sentence:0122","text":"They look at things like weekdays in different language models corresponding to certain shapes.","start":938.212,"end":946.725,"startLabel":"00:15:38.212","endLabel":"00:15:46.725","cueMatchScore":1.0}],"cueMatchScore":1.0},{"id":"tidy:paragraph:058","text":"So I put aside my naive way of finding a few columns that had useful parameters, and tried to get my head around the whole higher-dimensional geometry they are using, because it seems more fundamental.","start":946.7 m speaking Italian, German, French, English, or some weird mixture, if I say a word like good, bad, evil, or positive, it is going to have some kind of shape.","start":982.613,"end":992.003,"startLabel":"00:16:22.613","endLabel":"00:16:32.003","cueMatchScore":1.0}],"cueMatchScore":1.0},{"id":"tidy:paragraph:062","text":"When I am talking to you and I can see that shape, that is another dimension we can communicate across.","start":992.044,"end":996.992,"startLabel":"00:16:32.044","endLabel":"00:16:36.992","score":null,"sentences":[{"id":"tidy:sentence:0129","text":"When I am talking to you and I can see that shape, that is another dimension we can communicate across.","start":992.044,"end":996.992,"startLabel":"00:16:32.044","endLabel":"00:16:36.992","cueMatchScore":1.0}],"cueMatchScore":1.0},{"id":"tidy:paragraph:063","text":"That is very much why I am trying to build my whole system. What you are describing is that we need a visual medium for it. This is really cool to see. It shows how it works on the data side. Thank you. Very cool.","start":997.363,"end":1010.722,"startLabel":"00:16:37.363","endLabel":"00:16:50.722","score":null,"sentences":[{"id":"tidy:sentence:0130","text":"That is very much why I am trying to build my whole system.","start":997.363,"end":1001.216,"startLabel":"00:16:37.363","endLabel":"00:16:41.216","cueMatchScore":1.0},{"id":"tidy:sentence:0131","text":"What you are describing is that we need a visual medium for it.","start":1001.8340000000001,"end":1004.675,"startLabel":"00:16:41.834","endLabel":"00:16:44.675","cueMatchScore":1.0},{"id":"tidy:sentence:0132","text":"This is really cool to see.","start":1004.705,"end":1005.969,"startLabel":"00:16:44.705","endLabel":"00:16:45.969","cueMatchScore":1.0},{"id":"tidy:sentence:0133","text":"It shows how it works on the data side.","start":1005.999,"end":1008.225,"startLabel":"00:16:45.999","endLabel":"00:16:48.225","cueMatchScore":1.0},{"id":"tidy:sentence:0134","text":"Thank you.","start":1009.29

const WINDOW_KIND_WEIGHT = { sentences: 4, short: 3, broad: 2, chapters: 1 };

document.querySelectorAll(".topic > title").forEach(title => title.remove());

let fitScale = 1;
let current = { x: 0, y: 0, scale: 1 };
let target = { x: 0, y: 0, scale: 1 };
let isAnimating = false;
let isDragging = false;
let lastPointer = null;
let dragStartPointer = null;
let dragDistanceSquared = 0;
let hoveredNode = null;
let selectedTopicId = "";
let activeTopicIds = new Set();
let activeChapterId = "";
let activeCueId = "";
let activeTranscriptSentenceId = "";
let activeTranscriptParagraphId = "";
let topicRelevanceById = new Map();
let topicThresholdScore = 0;
let lastHashUpdate = 0;
let pendingInitialHash = parseHash();
let navigationDepth = 0;

function parseTranslate(transform) {
  const match = String(transform).match(/translate\(([-0-9.]+)[ ,]+([-0-9.]+)\)/);
  if (!match) return { x: 0, y: 0 };
  return { x: Number(match[1]), y: Number(match[2]) };
}

const nodes = Array.from(document.querySelectorAll(".topic")).map(group => {
  const salience = Number(group.dataset.salience || 0);
  const overviewPriority = Number(group.dataset.overviewPriority || 0);
  const position = parseTranslate(group.getAttribute("transform") || "");
  return {
    id: group.dataset.nodeId,
    group,
    salience,
    overviewPriority,
    position,
    hovered: false,
  };
});
const nodeById = new Map(nodes.map(node => [node.id, node]));
const topicById = new Map(DATA.topics.map(topic => [topic.id, topic]));
const transcriptParagraphs = [];
const transcriptSentences = [];
const paragraphById = new Map();
const sentenceById = new Map();

for (const section of DATA.sections) {
  for (const paragraph of section.paragraphs || []) {
    const paragraphRecord = { ...paragraph, sectionId: section.id };
    transcriptParagraphs.push(paragraphRecord);
    paragraphById.set(paragraph.id, paragraphRecord);
    for (const sentence of paragraph.sentences || []) {
      const sentenceRecord = { ...sentence, paragraphId: paragraph.id, sectionId: section.id };
      transcriptSentences.push(sentenceRecord);
      sentenceById.set(sentence.id, sentenceRecord);
    }
  }
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  }[char]));
}

function inlineMarkdown(value) {
  let text = escapeHtml(value);
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
  text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  return text;
}

function clamp(value, low, high) {
  return Math.max(low, Math.min(high, value));
}

function smoothstep(edge0, edge1, value) {
  const x = clamp((value - edge0) / (edge1 - edge0), 0, 1);
  return x * x * (3 - 2 * x);
}

function formatTime(seconds) {
  const totalMillis = Math.max(0, Math.round(Number(seconds || 0) * 1000));
  const hours = Math.floor(totalMillis / 3600000);
  const minutes = Math.floor((totalMillis % 3600000) / 60000);
  const wholeSeconds = Math.floor((totalMillis % 60000) / 1000);
  const millis = totalMillis % 1000;
  return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(wholeSeconds).padStart(2, "0")}.${String(millis).padStart(3, "0")}`;
}

function formatHashTime(seconds) {
  const totalSeconds = Math.max(0, Math.floor(Number(seconds || 0)));
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const wholeSeconds = totalSeconds % 60;
  if (hours > 0) return `${hours}:${String(minutes).padStart(2, "0")}:${String(wholeSeconds).padStart(2, "0")}`;
  return `${minutes}:${String(wholeSeconds).padStart(2, "0")}`;
}

function formatShortTime(seconds) {
  const totalSeconds = Math.max(0, Math.floor(Number(seconds || 0)));
  const minutes = Math.floor(totalSeconds / 60);
  const wholeSeconds = totalSeconds % 60;
  return `${minutes}:${String(wholeSeconds).padStart(2, "0")}`;
}

function parseTime(value) {
  if (!value) return null;
  const text = String(value).trim();
  if (/^\d+(\.\d+)?$/.test(text)) return Number(text);
  const parts = text.split(":");
  if (parts.length === 2 && /^\d+$/.test(parts[0]) && /^\d+(?:\.\d+)?$/.test(parts[1])) {
    return Number(parts[0]) * 60 + Number(parts[1]);
  }
  if (parts.length === 3 && /^\d+$/.test(parts[0]) && /^\d+$/.test(parts[1]) && /^\d+(?:\.\d+)?$/.test(parts[2])) {
    return Number(parts[0]) * 3600 + Number(parts[1]) * 60 + Number(parts[2]);
  }
  return null;
}

function parseHash() {
  const params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  return {
    topic: params.get("topic") || "",
    time: parseTime(params.get("t")),
  };
}

function finiteTime(value) {
  return Number.isFinite(Number(value));
}

function windowsOverlap(aStart, aEnd, bStart, bEnd) {
  return Number(aStart) <= Number(bEnd) && Number(aEnd) >= Number(bStart);
}

function itemAtTime(items, seconds) {
  return items.find(item => finiteTime(item.start) && finiteTime(item.end) && seconds >= Number(item.start) && seconds <= Number(item.end)) || null;
}

function cueAtTime(seconds) {
  return itemAtTime(DATA.cues, seconds);
}

function activeTranscriptAtTime(seconds, cue = cueAtTime(seconds)) {
  if (cue) {
    const sentenceId = cue.transcriptSentenceId || "";
    const paragraphId = cue.transcriptParagraphId || "";
    if (sentenceId && sentenceById.has(sentenceId)) {
      const sentence = sentenceById.get(sentenceId);
      return { sentence, paragraph: paragraphById.get(sentence.paragraphId) || null };
    }
    if (paragraphId && paragraphById.has(paragraphId)) {
      return { sentence: null, paragraph: paragraphById.get(paragraphId) };
    }
  }
  const sentence = itemAtTime(transcriptSentences, seconds);
  if (sentence) {
    return { sentence, paragraph: paragraphById.get(sentence.paragraphId) || null };
  }
  return { sentence: null, paragraph: itemAtTime(transcriptParagraphs, seconds) };
}

function allTopicWindows(topicId) {
  const windows = DATA.topicWindows[topicId] || {};
  const items = [];
  for (const kind of ["sentences", "short", "broad", "chapters"]) {
    for (const windowInfo of windows[kind] || []) {
      items.push({ ...windowInfo, kind });
    }
  }
  return items;
}

function primaryWindow(topicId) {
  return allTopicWindows(topicId)
    .sort((a, b) => {
      const scoreDelta = Number(b.score || 0) - Number(a.score || 0);
      if (Math.abs(scoreDelta) > 0.000001) return scoreDelta;
      return (WINDOW_KIND_WEIGHT[b.kind] || 0) - (WINDOW_KIND_WEIGHT[a.kind] || 0) || Number(a.start) - Number(b.start);
    })[0] || null;
}

function renderMapTransform() {
  map.style.transform = `translate(${current.x.toFixed(2)}px, ${current.y.toFixed(2)}px) scale(${current.scale.toFixed(5)})`;
}

function mapContentBounds() {
  const padding = 58;
  if (!nodes.length) return { left: 0, top: 0, width: SVG_SIZE, height: SVG_SIZE };
  const xs = nodes.map(node => node.position.x);
  const ys = nodes.map(node => node.position.y);
  const left = Math.max(0, Math.min(...xs) - padding);
  const top = Math.max(0, Math.min(...ys) - padding);
  const right = Math.min(SVG_SIZE, Math.max(...xs) + padding);
  const bottom = Math.min(SVG_SIZE, Math.max(...ys) + padding);
  return {
    left,
    top,
    width: Math.max(1, right - left),
    height: Math.max(1, bottom - top),
  };
}

function resizeToFit(zoomRatio = START_ZOOM) {
  const width = viewport.clientWidth || Math.floor(viewport.getBoundingClientRect().width);
  const height = viewport.clientHeight || Math.floor(viewport.getBoundingClientRect().height);
  if (width <= 0 || height <= 0) {
    requestAnimationFrame(() => resizeToFit(zoomRatio));
    return;
  }
  const bounds = mapContentBounds();
  fitScale = Math.min(width / bounds.width, height / bounds.height);
  const scale = fitScale * zoomRatio;
  target.scale = scale;
  current.scale = scale;
  target.x = current.x = ((width - bounds.width * scale) / 2) - bounds.left * scale;
  target.y = current.y = ((height - bounds.height * scale) / 2) - bounds.top * scale;
  renderMapTransform();
  updateTopicOpacity();
}

function setTargetZoom(ratio, anchorX = viewport.clientWidth / 2, anchorY = viewport.clientHeight / 2) {
  const oldScale = target.scale || fitScale;
  const newScale = clamp(fitScale * ratio, fitScale * 0.42, fitScale * 4.2);
  const mapX = (anchorX - target.x) / oldScale;
  const mapY = (anchorY - target.y) / oldScale;
  target.scale = newScale;
  target.x = anchorX - mapX * newScale;
  target.y = anchorY - mapY * newScale;
  updateTopicOpacity();
  startMapAnimation();
}

function viewportPointFromClient(clientX, clientY) {
  const rect = viewport.getBoundingClientRect();
  return {
    x: clientX - rect.left,
    y: clientY - rect.top,
  };
}

function focusNode(topicId, zoomRatio = 1.72) {
  const node = nodeById.get(topicId);
  if (!node || !fitScale) return;
  const width = viewport.clientWidth || Math.floor(viewport.getBoundingClientRect().width);
  const height = viewport.clientHeight || Math.floor(viewport.getBoundingClientRect().height);
  if (width <= 0 || height <= 0) {
    requestAnimationFrame(() => focusNode(topicId, zoomRatio));
    return;
  }
  const scale = clamp(fitScale * zoomRatio, fitScale * 0.42, fitScale * 4.2);
  target.scale = scale;
  target.x = (width / 2) - node.position.x * scale;
  target.y = (height / 2) - node.position.y * scale;
  updateTopicOpacity();
  startMapAnimation();
}

function updateTopicOpacity() {
  const zoomRatio = fitScale ? target.scale / fitScale : 1;
  const reveal = smoothstep(0.60, 1.62, zoomRatio);
  const wideReveal = smoothstep(0.88, 2.18, zoomRatio);
  const fullReveal = smoothstep(1.55, 2.35, zoomRatio);

  for (const node of nodes) {
    const coreLandmark = node.overviewPriority >= 0.82;
    const secondaryLandmark = node.overviewPriority >= 0.66;
    let overviewOpacity = 0.38;
    if (coreLandmark) overviewOpacity = 1;
    else if (secondaryLandmark) overviewOpacity = 0.68;
    else if (node.overviewPriority >= 0.52) overviewOpacity = 0.50;
    else if (node.overviewPriority >= 0.40) overviewOpacity = 0.42;

    const rankedDetailOpacity = clamp(0.44 + node.salience * 0.56, 0.44, 1);
    const relevance = topicRelevanceById.has(node.id) ? topicRelevanceById.get(node.id) : 0;
    let opacity = clamp(overviewOpacity * (1 - reveal) + rankedDetailOpacity * reveal + wideReveal * 0.10, 0.34, 1);
    opacity = clamp(opacity * (1 - fullReveal) + fullReveal, 0.34, 1);
    opacity = clamp(opacity * (0.72 + relevance * 0.28), 0.30, 1);
    if (node.hovered || node.id === selectedTopicId || activeTopicIds.has(node.id)) opacity = 1;
    node.group.style.opacity = opacity.toFixed(3);
  }
}

function startMapAnimation() {
  if (isAnimating) return;
  isAnimating = true;
  requestAnimationFrame(animateMap);
}

function animateMap() {
  const dx = target.x - current.x;
  const dy = target.y - current.y;
  const ds = target.scale - current.scale;
  if (Math.abs(dx) < POSITION_EPSILON && Math.abs(dy) < POSITION_EPSILON && Math.abs(ds) < SCALE_EPSILON) {
    current.x = target.x;
    current.y = target.y;
    current.scale = target.scale;
    renderMapTransform();
    isAnimating = false;
    return;
  }
  current.x += (target.x - current.x) * EASE;
  current.y += (target.y - current.y) * EASE;
  current.scale += (target.scale - current.scale) * EASE;
  renderMapTransform();
  requestAnimationFrame(animateMap);
}

function setupSplitter(splitter, onMove) {
  let dragging = false;
  splitter.addEventListener("pointerdown", event => {
    dragging = true;
    splitter.classList.add("is-dragging");
    splitter.setPointerCapture(event.pointerId);
    onMove(event);
  });
  splitter.addEventListener("pointermove", event => {
    if (!dragging) return;
    onMove(event);
  });
  splitter.addEventListener("pointerup", event => {
    dragging = false;
    splitter.classList.remove("is-dragging");
    try { splitter.releasePointerCapture(event.pointerId); } catch (error) {}
  });
  splitter.addEventListener("pointercancel", () => {
    dragging = false;
    splitter.classList.remove("is-dragging");
  });
}

function visibleTopics() {
  return DATA.topics.filter(topic => Number(topic.displayScore || 0) + 0.000001 >= topicThresholdScore);
}

function updateTopicThresholdLabel(count = visibleTopics().length) {
  const percent = Math.round(topicThresholdScore * 100);
  if (topicThresholdPercent) topicThresholdPercent.textContent = `${percent}%`;
  if (topicThresholdValue) {
    topicThresholdValue.textContent = percent <= 0 ? `${DATA.topics.length} shown` : `${count}/${DATA.topics.length} shown`;
  }
}

function applyTopicButtonStates() {
  topicList.querySelectorAll("[data-topic-id]").forEach(button => {
    const id = button.dataset.topicId;
    const relevance = topicRelevanceById.has(id) ? topicRelevanceById.get(id) : 0;
    button.style.setProperty("--topic-opacity", (0.34 + relevance * 0.66).toFixed(3));
    button.classList.toggle("is-active", activeTopicIds.has(id));
    button.classList.toggle("is-selected", id === selectedTopicId);
  });
}

function renderTopics() {
  const topics = visibleTopics();
  topicList.innerHTML = topics.map(topic => topicChip(topic.id)).join("");
  updateTopicThresholdLabel(topics.length);
  bindTopicChips(topicList);
  applyTopicButtonStates();
  fitTopicGrid();
}

function narrowLayout() {
  return window.matchMedia("(max-width: 700px)").matches;
}

function fitTopicGrid() {
  if (!topicList || !DATA.topics.length) return;
  if (narrowLayout()) {
    topicList.style.removeProperty("--topic-columns");
    topicList.style.removeProperty("--topic-row-height");
    topicList.style.removeProperty("--topic-icon-size");
    topicList.style.removeProperty("--topic-font-size");
    return;
  }
  const count = topicList.querySelectorAll("[data-topic-id]").length;
  if (!count) return;
  const rect = topicList.getBoundingClientRect();
  if (rect.width <= 0 || rect.height <= 0) return;
  const gap = 4;
  let bestColumns = 1;
  let bestRowHeight = 1;
  let bestIconSize = 10;
  let bestFontSize = 7;
  let bestScore = -1;
  for (let columns = 1; columns <= count; columns += 1) {
    const rows = Math.ceil(count / columns);
    const widthSize = (rect.width - gap * (columns - 1)) / columns;
    const heightSize = (rect.height - gap * (rows - 1)) / rows;
    if (widthSize <= 0 || heightSize <= 0) continue;
    const iconSize = clamp(Math.min(widthSize * 0.52, heightSize * 0.44), 8, 42);
    const labelRoom = Math.max(8, heightSize - iconSize - 7);
    const fontSize = clamp(Math.min(widthSize * 0.16, labelRoom * 0.48), 6.5, 11.5);
    const crampedPenalty = widthSize < 34 ? widthSize / 34 : 1;
    const score = (Math.min(widthSize, heightSize * 0.94) * crampedPenalty) + iconSize * 0.12 + fontSize * 0.22;
    if (score > bestScore || (Math.abs(score - bestScore) < 0.1 && columns < bestColumns)) {
      bestScore = score;
      bestColumns = columns;
      bestRowHeight = heightSize;
      bestIconSize = iconSize;
      bestFontSize = fontSize;
    }
  }
  topicList.style.setProperty("--topic-columns", String(bestColumns));
  topicList.style.setProperty("--topic-row-height", `${Math.max(1, Math.floor(bestRowHeight))}px`);
  topicList.style.setProperty("--topic-icon-size", `${Math.max(6, Math.floor(bestIconSize))}px`);
  topicList.style.setProperty("--topic-font-size", `${bestFontSize.toFixed(1)}px`);
}

setupSplitter(mediaSplitter, event => {

setupSplitter(videoSplitter, event => {

setupSplitter(lowerSplitter, event => {

  const rect = lowerPanel.getBoundingClientRect();
  const splitterWidth = lowerSplitter.getBoundingClientRect().width;
  const topicsWidth = clamp(event.clientX - rect.left, 120, rect.width - splitterWidth - 180);
  lowerPanel.classList.add("has-custom-columns");
  lowerPanel.style.setProperty("--topics-width", `${topicsWidth}px`);
  fitTopicGrid();
});

if (topicThreshold) {
  topicThreshold.addEventListener("input", () => {
    topicThresholdScore = Number(topicThreshold.value || 0) / 100;
    renderTopics();
  });
}

viewport.addEventListener("wheel", event => {
  event.preventDefault();
  const zoomFactor = Math.exp(-event.deltaY * 0.00125);
  const nextRatio = (target.scale * zoomFactor) / fitScale;
  const anchor = viewportPointFromClient(event.clientX, event.clientY);
  setTargetZoom(nextRatio, anchor.x, anchor.y);
}, { passive: false });

viewport.addEventListener("pointerdown", event => {
  isDragging = true;
  target.x = current.x;
  target.y = current.y;
  target.scale = current.scale;
  lastPointer = { x: event.clientX, y: event.clientY };
  dragStartPointer = { x: event.clientX, y: event.clientY };
  dragDistanceSquared = 0;
  viewport.classList.add("dragging");
  viewport.setPointerCapture(event.pointerId);
});

viewport.addEventListener("pointermove", event => {
  if (isDragging && lastPointer) {
    const dx = event.clientX - lastPointer.x;
    const dy = event.clientY - lastPointer.y;
    if (dragStartPointer) {
      const totalDx = event.clientX - dragStartPointer.x;
      const totalDy = event.clientY - dragStartPointer.y;
      dragDistanceSquared = Math.max(dragDistanceSquared, totalDx * totalDx + totalDy * totalDy);
    }
    current.x += dx;
    current.y += dy;
    target.x += dx;
    target.y += dy;
    renderMapTransform();
    lastPointer = { x: event.clientX, y: event.clientY };
    return;
  }
  updateHoverFromPointer(event);
});

viewport.addEventListener("pointerup", event => {
  const tappedNode = dragDistanceSquared <= 36 ? nodeAtClientPoint(event.clientX, event.clientY) : null;
  isDragging = false;
  lastPointer = null;
  dragStartPointer = null;
  dragDistanceSquared = 0;
  viewport.classList.remove("dragging");
  try { viewport.releasePointerCapture(event.pointerId); } catch (error) {}
  if (tappedNode) jumpToTopic(tappedNode.id);
});

function setHoveredNode(nextNode) {
  if (hoveredNode === nextNode) return;
  if (hoveredNode) {
    hoveredNode.hovered = false;
    hoveredNode.group.classList.remove("is-hovered");
  }
  hoveredNode = nextNode;
  if (hoveredNode) {
    hoveredNode.hovered = true;
    hoveredNode.group.classList.add("is-hovered");
    hoveredNode.group.parentNode.appendChild(hoveredNode.group);
  }
  updateTopicOpacity();
}

function updateHoverFromPointer(event) {
  setHoveredNode(nodeAtClientPoint(event.clientX, event.clientY));
}

function nodeAtClientPoint(clientX, clientY) {
  const point = viewportPointFromClient(clientX, clientY);
  const mapX = (point.x - current.x) / current.scale;
  const mapY = (point.y - current.y) / current.scale;
  let bestNode = null;
  let bestDistanceSquared = Infinity;
  for (const node of nodes) {
    const dx = mapX - node.position.x;
    const dy = mapY - (node.position.y - 4);
    const radius = 32.0;
    const distanceSquared = dx * dx + dy * dy;
    if (distanceSquared <= radius * radius && distanceSquared < bestDistanceSquared) {
      bestNode = node;
      bestDistanceSquared = distanceSquared;
    }
  }
  return bestNode;
}

function jumpToTopic(topicId, pushHash = true) {
  const windowInfo = primaryWindow(topicId);
  selectedTopicId = topicId;
  if (windowInfo) video.currentTime = windowInfo.start;
  focusNode(topicId);
  updateActiveState(false, false);
  scrollActiveTranscriptIntoView();
  writeHash(pushHash);
}

function jumpToTime(seconds, topicId = "", pushHash = true) {
  selectedTopicId = topicId || "";
  video.currentTime = seconds;
  updateActiveState(false, false);
  writeHash(pushHash);
}

function topicsAtTime(seconds, chapter, cue) {
  const hits = [];
  for (const topic of DATA.topics) {
    const relevance = topicRelevance(topic.id, seconds, chapter, cue);
    if (relevance >= 0.30) hits.push({ topic, relevance });
  }
  hits.sort((a, b) => b.relevance - a.relevance || a.topic.embeddingOrder - b.topic.embeddingOrder);
  return hits;
}

function windowMatchesChapter(windowInfo, chapter) {
  if (!chapter) return false;
  if (windowInfo.id && windowInfo.id === chapter.id) return true;
  return Math.abs(Number(windowInfo.start) - Number(chapter.start)) < 0.75 && Math.abs(Number(windowInfo.end) - Number(chapter.end)) < 0.75;
}

function topicSignalValue(topicId, seconds) {
  const keyframes = DATA.topicSignals?.topics?.[topicId] || [];
  if (!keyframes.length) return 0;
  const time = Number(seconds || 0);
  if (time <= Number(keyframes[0][0])) return clamp(Number(keyframes[0][1] || 0), 0, 1);
  const last = keyframes[keyframes.length - 1];
  if (time >= Number(last[0])) return clamp(Number(last[1] || 0), 0, 1);

  let low = 0;
  let high = keyframes.length - 1;
  while (high - low > 1) {
    const middle = Math.floor((low + high) / 2);
    if (Number(keyframes[middle][0]) <= time) low = middle;
    else high = middle;
  }

  const start = keyframes[low];
  const end = keyframes[high];
  const startTime = Number(start[0]);
  const endTime = Number(end[0]);
  const ratio = endTime > startTime ? (time - startTime) / (endTime - startTime) : 0;
  const value = Number(start[1] || 0) + (Number(end[1] || 0) - Number(start[1] || 0)) * ratio;
  return clamp(value, 0, 1);
}

function topicRelevance(topicId, seconds, chapter, cue) {
  let relevance = topicSignalValue(topicId, seconds);
  if (topicId === selectedTopicId) relevance = 1;
  return clamp(relevance, 0, 1);
}

function topicChip(topicId) {
  const topic = topicById.get(topicId);
  if (!topic) return "";
  const image = topic.iconSrc ? `<img src="${escapeHtml(topic.iconSrc)}" alt="" loading="lazy" decoding="async">` : "";
  return `<button class="topic-chip" type="button" data-topic-id="${escapeHtml(topic.id)}" aria-label="${escapeHtml(topic.title)}" title="${escapeHtml(topic.title)}">${image}<span>${escapeHtml(topic.label)}</span></button>`;
}

function chapterIcon(topicId, fallbackLabel) {
  const topic = topicById.get(topicId);
  if (!topic) return `<span class="chapter-icon">${escapeHtml(fallbackLabel)}</span>`;
  const image = topic.iconSrc ? `<img src="${escapeHtml(topic.iconSrc)}" alt="" loading="lazy" decoding="async">` : "";
  return `<span class="chapter-icon" title="${escapeHtml(topic.title)}">${image}</span>`;
}

function relatedTopicsForChapter(chapter) {
  if (chapter && chapter.topicIds && chapter.topicIds.length) return chapter.topicIds;
  return topicsAtTime(chapter ? chapter.start : video.currentTime || 0, chapter, null).slice(0, 5).map(hit => hit.topic.id);
}

function bindTopicChips(root = document) {
  root.querySelectorAll(".topic-chip").forEach(chip => {
    chip.addEventListener("click", event => {
      event.stopPropagation();
      jumpToTopic(chip.dataset.topicId);
    });
    chip.addEventListener("mouseenter", () => {
      const node = nodeById.get(chip.dataset.topicId);
      if (node) setHoveredNode(node);
    });
    chip.addEventListener("mouseleave", () => setHoveredNode(null));
  });
}

function renderTranscriptParagraph(paragraph) {
  const timed = finiteTime(paragraph.start);
  const attrs = timed ? `data-start="${Number(paragraph.start)}" data-end="${Number(paragraph.end)}" tabindex="0" role="button"` : "";
  const time = timed ? `<span class="paragraph-time">${formatShortTime(paragraph.start)}</span>` : "";
  const sentenceMarkup = (paragraph.sentences || []).map(sentence => {
    const sentenceTimed = finiteTime(sentence.start);
    const sentenceAttrs = sentenceTimed
      ? `data-sentence-id="${escapeHtml(sentence.id)}" data-start="${Number(sentence.start)}" data-end="${Number(sentence.end)}" tabindex="0" role="button"`
      : "";
    return `<span class="transcript-sentence" ${sentenceAttrs}>${inlineMarkdown(sentence.text)}</span>`;
  }).join(" ");
  return `<p class="transcript-paragraph" data-paragraph-id="${escapeHtml(paragraph.id)}" ${attrs}>${time}${sentenceMarkup}</p>`;
}

function renderTranscriptSection(section) {
  const paragraphs = (section.paragraphs || []).map(renderTranscriptParagraph).join("");
  if (!paragraphs) return "";
  return `<section class="transcript-section" data-section-id="${escapeHtml(section.id)}">
    <h3 class="transcript-section-title">${inlineMarkdown(section.heading)}</h3>
    ${paragraphs}
  </section>`;
}

function renderLists() {
  chapterList.innerHTML = DATA.chapters.map((chapter, index) => {
    const chapterNumber = String(index + 1).padStart(2, "0");
    const topicId = relatedTopicsForChapter(chapter)[0] || "";
    return `<button class="chapter-card" type="button" data-chapter-id="${escapeHtml(chapter.id)}" data-start="${chapter.start}" aria-label="Chapter ${chapterNumber}: ${escapeHtml(chapter.title)}" title="${escapeHtml(chapter.title)}">
      ${chapterIcon(topicId, chapterNumber)}
      <span class="chapter-number">${chapterNumber}</span>
      <span class="chapter-label">${escapeHtml(chapter.label || chapter.title)}</span>
    </button>`;
  }).join("");

  transcript.innerHTML = DATA.sections.map(renderTranscriptSection).join("");
  renderTopics();

  chapterList.querySelectorAll("[data-chapter-id]").forEach(button => {
    button.addEventListener("click", () => jumpToTime(Number(button.dataset.start)));
    button.addEventListener("keydown", event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      jumpToTime(Number(button.dataset.start));
    });
  });
  transcript.querySelectorAll(".transcript-sentence[data-start]").forEach(sentence => {
    sentence.addEventListener("click", event => {
      if (event.target.closest("a")) return;
      event.stopPropagation();
      jumpToTime(Number(sentence.dataset.start));
    });
    sentence.addEventListener("keydown", event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      jumpToTime(Number(sentence.dataset.start));
    });
  });
  transcript.querySelectorAll(".transcript-paragraph[data-start]").forEach(paragraph => {
    paragraph.addEventListener("click", event => {
      if (event.target.closest("a") || event.target.closest(".transcript-sentence[data-start]")) return;
      jumpToTime(Number(paragraph.dataset.start));
    });
    paragraph.addEventListener("keydown", event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      jumpToTime(Number(paragraph.dataset.start));
    });
  });
}

function scrollTopicIntoView(topicId) {
  const button = topicList.querySelector(`[data-topic-id="${CSS.escape(topicId)}"]`);
  if (button) button.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function scrollActiveTranscriptIntoView() {
  const active = transcript.querySelector(".transcript-sentence.is-active, .transcript-paragraph.is-active");
  if (active) active.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function updateActiveState(forceHash = false, updateHash = true) {
  const seconds = video.currentTime || 0;
  const chapter = itemAtTime(DATA.chapters, seconds);
  const cue = cueAtTime(seconds);
  const transcriptHit = activeTranscriptAtTime(seconds, cue);
  const previousTranscriptSentenceId = activeTranscriptSentenceId;
  const previousTranscriptParagraphId = activeTranscriptParagraphId;
  captionOverlay.textContent = cue ? cue.text : "";
  captionOverlay.classList.toggle("is-visible", Boolean(cue));

  if (selectedTopicId) {
    const selectedWindows = allTopicWindows(selectedTopicId);
    const selectedStillRelevant = selectedWindows.some(windowInfo => seconds >= Number(windowInfo.start) && seconds <= Number(windowInfo.end));
    if (selectedWindows.length && !selectedStillRelevant && selectedTopicId !== pendingInitialHash.topic) selectedTopicId = "";
  }

  const relevanceScores = DATA.topics.map(topic => {
    const relevance = topicRelevance(topic.id, seconds, chapter, cue);
    topicRelevanceById.set(topic.id, relevance);
    return { topic, relevance };
  }).sort((a, b) => b.relevance - a.relevance || a.topic.embeddingOrder - b.topic.embeddingOrder);
  updateMobileContext(seconds, chapter, cue, relevanceScores);

  activeTopicIds = new Set(relevanceScores.filter(item => item.relevance >= 0.66).slice(0, 12).map(item => item.topic.id));
  activeChapterId = chapter ? chapter.id : "";
  activeCueId = cue ? cue.id : "";
  activeTranscriptSentenceId = transcriptHit.sentence ? transcriptHit.sentence.id : "";
  activeTranscriptParagraphId = transcriptHit.paragraph ? transcriptHit.paragraph.id : "";

  for (const node of nodes) {
    node.group.classList.toggle("is-active", activeTopicIds.has(node.id));
    node.group.classList.toggle("is-selected", node.id === selectedTopicId);
  }
  applyTopicButtonStates();
  chapterList.querySelectorAll("[data-chapter-id]").forEach(button => {
    button.classList.toggle("is-active", button.dataset.chapterId === activeChapterId);
  });
  transcript.querySelectorAll(".transcript-sentence[data-sentence-id]").forEach(sentence => {
    sentence.classList.toggle("is-active", sentence.dataset.sentenceId === activeTranscriptSentenceId);
  });
  transcript.querySelectorAll(".transcript-paragraph[data-paragraph-id]").forEach(paragraph => {
    const active = paragraph.dataset.paragraphId === activeTranscriptParagraphId;
    paragraph.classList.toggle("is-active", active);
    paragraph.classList.toggle("has-active-sentence", active && Boolean(activeTranscriptSentenceId));
  });

  if (
    activeTranscriptSentenceId && activeTranscriptSentenceId !== previousTranscriptSentenceId ||
    !activeTranscriptSentenceId && activeTranscriptParagraphId && activeTranscriptParagraphId !== previousTranscriptParagraphId
  ) {
    scrollActiveTranscriptIntoView();
  }

  if (updateHash && (forceHash || Date.now() - lastHashUpdate > HASH_UPDATE_MS)) writeHash(false);
  updateTopicOpacity();
}

function updateUndoButton() {
  navUndo.disabled = navigationDepth <= 0;
}

function writeHash(push = false) {
  const seconds = video.currentTime || 0;
  const topic = selectedTopicId || topicsAtTime(seconds, itemAtTime(DATA.chapters, seconds), cueAtTime(seconds))[0]?.topic.id || "";
  const topicPart = topic ? `topic=${encodeURIComponent(topic)}&` : "";
  const nextHash = `#${topicPart}t=${formatHashTime(seconds)}`;
  const shouldPush = push && window.location.hash !== nextHash;
  const nextDepth = shouldPush ? navigationDepth + 1 : navigationDepth;
  const state = { talk2: true, navigationDepth: nextDepth };
  if (window.location.hash !== nextHash || !window.history.state || !window.history.state.talk2) {
    if (shouldPush) window.history.pushState(state, "", nextHash);
    else window.history.replaceState(state, "", nextHash);
  }
  navigationDepth = nextDepth;
  updateUndoButton();
  lastHashUpdate = Date.now();
}


function classifyLayout() {
  const width = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 0);
  const height = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 0);
  if (width >= 1100 && height >= 620) return "desktop";
  if (width > height) return height <= 520 ? "tiny-landscape" : "landscape";
  return "portrait";
}

function updateLayoutState() {
  const nextLayout = classifyLayout();
  if (app.dataset.layout !== nextLayout) app.dataset.layout = nextLayout;
  return nextLayout;
}

function fitAfterLayout(zoomRatio = START_ZOOM) {
  updateLayoutState();
  requestAnimationFrame(() => {
    updateLayoutState();
    resizeToFit(zoomRatio);
    fitTopicGrid();
    requestAnimationFrame(() => {
      updateLayoutState();
      resizeToFit(zoomRatio);
      fitTopicGrid();
    });
  });
}

function setMobileMode(mode) {
  const allowedModes = new Set(["dual", "video", "map", "read", "topics"]);
  const nextMode = allowedModes.has(mode) ? mode : "dual";
  app.dataset.mode = nextMode;
  updateLayoutState();
  mobileModeButtons.forEach(button => {
    button.classList.toggle("is-active", button.dataset.mobileMode === nextMode);
    button.setAttribute("aria-current", button.dataset.mobileMode === nextMode ? "page" : "false");
  });
  if (mobileTopbarMode) mobileTopbarMode.textContent = nextMode.charAt(0).toUpperCase() + nextMode.slice(1);
  try { window.localStorage.setItem("talk2-mobile-mode", nextMode); } catch (_error) {}
  fitAfterLayout(nextMode === "map" ? 0.98 : START_ZOOM);
  if (selectedTopicId && nextMode === "map") {
    requestAnimationFrame(() => focusNode(selectedTopicId, 1.42));
  }
}

function updateMobileContext(seconds, chapter, cue, relevanceScores) {
  const selectedTopic = selectedTopicId ? topicById.get(selectedTopicId) : null;
  const bestTopic = selectedTopic || relevanceScores.find(item => item.relevance > 0.12)?.topic || null;
  const title = bestTopic ? bestTopic.title : (chapter ? chapter.label || chapter.title : "Current moment");
  const chapterLabel = chapter ? chapter.label || chapter.title : "video";
  const metaParts = [formatShortTime(seconds), chapterLabel];
  if (bestTopic && bestTopic.cluster) metaParts.push(bestTopic.cluster);
  const description = bestTopic && bestTopic.description ? bestTopic.description : (cue ? cue.text : "Video and live map are synced to this moment.");
  if (currentTopicTitle) currentTopicTitle.textContent = title;
  if (currentTopicMeta) currentTopicMeta.textContent = metaParts.join(" · ");
  if (currentTopicDescription) currentTopicDescription.textContent = description;
  if (mobileTopbarTitle) {
    const heading = chapter ? chapter.title || chapter.label : title;
    mobileTopbarTitle.textContent = `${formatShortTime(seconds)} · ${heading}`;
  }
}

mobileModeButtons.forEach(button => {
  button.addEventListener("click", () => setMobileMode(button.dataset.mobileMode));
});

if (currentTopicAction) {
  currentTopicAction.addEventListener("click", () => {
    const topicId = selectedTopicId || topicsAtTime(video.currentTime || 0, itemAtTime(DATA.chapters, video.currentTime || 0), cueAtTime(video.currentTime || 0))[0]?.topic.id || "";
    if (topicId) jumpToTopic(topicId);
  });
}

if (topicSearch) topicSearch.addEventListener("input", renderTopics);

nodes.forEach(node => {
  node.group.addEventListener("click", event => {
    event.stopPropagation();
    jumpToTopic(node.id);
  });
});

navUndo.addEventListener("click", () => {
  if (navigationDepth > 0) window.history.back();
});

video.addEventListener("loadedmetadata", () => {
  if (pendingInitialHash.time !== null) video.currentTime = pendingInitialHash.time;
  else if (pendingInitialHash.topic) {
    const windowInfo = primaryWindow(pendingInitialHash.topic);
    if (windowInfo) video.currentTime = windowInfo.start;
  }
  if (pendingInitialHash.topic) {
    selectedTopicId = pendingInitialHash.topic;
    focusNode(selectedTopicId);
  }
  updateActiveState(true, false);
  writeHash(false);
});
video.addEventListener("timeupdate", () => updateActiveState());
video.addEventListener("durationchange", () => updateActiveState());
window.addEventListener("popstate", event => {
  navigationDepth = event.state && event.state.talk2 ? Number(event.state.navigationDepth || 0) : 0;
  updateUndoButton();
  pendingInitialHash = parseHash();
  selectedTopicId = pendingInitialHash.topic || "";
  if (pendingInitialHash.time !== null) video.currentTime = pendingInitialHash.time;
  else if (pendingInitialHash.topic) jumpToTopic(pendingInitialHash.topic, false);
  updateActiveState(true, false);
});
viewport.addEventListener("pointerleave", () => setHoveredNode(null));
window.addEventListener("resize", () => {
  fitAfterLayout(target.scale / fitScale || START_ZOOM);
});
window.addEventListener("orientationchange", () => {
  setTimeout(() => fitAfterLayout(target.scale / fitScale || START_ZOOM), 80);
});
if ("visualViewport" in window) {
  window.visualViewport.addEventListener("resize", () => {
    fitAfterLayout(target.scale / fitScale || START_ZOOM);
  });
}

updateLayoutState();
renderLists();
let savedMode = "dual";
try { savedMode = window.localStorage.getItem("talk2-mobile-mode") || "dual"; } catch (_error) {}
setMobileMode(savedMode);
resizeToFit(START_ZOOM);
fitTopicGrid();
if ("ResizeObserver" in window) {
  const topicGridObserver = new ResizeObserver(() => fitTopicGrid());
  topicGridObserver.observe(topicList);
  topicGridObserver.observe(lowerPanel);
  topicGridObserver.observe(mediaPanel);
  topicGridObserver.observe(viewport);
}
setTimeout(() => setTargetZoom(INTRO_ZOOM), 320);
requestAnimationFrame(function tick() {
  updateActiveState();
  requestAnimationFrame(tick);
});
</script>
</body>
</html>
